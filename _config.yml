# Site settings
source: app
destination: web
url: "https://livermetabolism.com"

title: livermetabolism
description: > # this means to ignore newlines until "baseurl:"
  Research Group König
baseurl: "" # the subpath of your site, e.g. /blog/
email: matthias.koenig@uni-luebeck.de
git_address: https://github.com/matthiaskoenig
git_edit_address: https://github.com/matthiaskoenig/gh-pages
twitter_username: konigmatt
github_username:  matthiaskoenig
orcid_username: 0000-0003-1725-179X



# theme options from https://bootswatch.com/
# comment out this to use default Bootstrap
bootwatch: flatly
# bootwatch: sandstone

# Build settings
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
sass:
  style: compressed
  sourcemap: never
  # The vendored Bootstrap 5.3.8 / Bootswatch source (app/_sass/bootstrap,
  # app/_sass/bootswatch) still uses @import and old global Sass functions
  # internally - upstream Bootstrap hasn't migrated to @use/@forward yet
  # either. These are silenced deliberately rather than fixed by hand-
  # patching vendored files; re-evaluate when Bootstrap itself migrates.
  silence_deprecations: [import, if-function, global-builtin]
strict_front_matter: true
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  # High-quality source images are kept in the repo (app/assets/image,
  # app/assets/pdf/poster) as masters, but every page now references the
  # generated .webp rendition instead - excluding the raster originals
  # keeps them out of the deployed site so nothing ships them unused.
  - assets/image/**/*.png
  - assets/image/**/*.jpg
  - assets/image/**/*.jpeg
  - assets/image/**/*.gif
  - assets/pdf/poster/*.jpg
  - assets/pdf/poster/*.jpeg
  - assets/pdf/poster/*.png
timezone: Europe/Berlin
