# Build settings
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
sass:
  style: compressed
  sourcemap: never
strict_front_matter: true
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
timezone: Europe/Berlin
