# Serve the development server
# docker compose -f docker-compose-build.yml up
services:
  jekyll:
    # see docker-compose-build.yml for why Gemfile.lock is dropped first
    command: bash -c "rm -f Gemfile.lock && bundle install && bundle exec jekyll serve --host 0.0.0.0"
    image: jekyll/jekyll:4.4.1
    volumes:
      - $PWD:/srv/jekyll
      - $PWD/app/vendor/bundle:/usr/local/bundle
#    environment:
#      JEKYLL_UID: 1001
#      JEKYLL_GID: 1001
    ports:
      - "4000:4000"
      - "35731:35729"
      - "3000:3000"
    networks:
      - default