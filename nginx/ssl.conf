ssl_session_cache shared:le_nginx_SSL:2m;
ssl_session_timeout 60m;

# TLSv1/1.1 dropped: both deprecated per RFC 8996 and unsupported by
# current browsers; cipher list follows Mozilla's "Intermediate" preset
# (https://ssl-config.mozilla.org/) - TLSv1.3 cipher suites are handled
# by OpenSSL automatically and aren't controlled by ssl_ciphers.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# ssl_dhparam /etc/ssl/certs/dhparam.pem;

# OCSP stapling
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=86400s;
resolver_timeout 5s;

# Set HSTS to 365 days
add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload';
add_header X-Frame-Options DENY;
add_header X-Content-Type-Options nosniff;

server_tokens off;
