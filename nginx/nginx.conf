user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 8192;

events {
  worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    server {
        listen 80;
        listen [::]:80;

        # site
        client_max_body_size 100m;
        # X-Frame-Options and X-Content-Type-Options are set by the host
        # reverse proxy's snippets/ssl.conf (included in front of this
        # container in production); not duplicated here.
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # Astro fingerprints everything under _astro/ (CSS/JS bundles, island
        # chunks) per build, so those can be cached for a long time; a new
        # deploy produces new file names.
        location /_astro/ {
            root   /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        }

        # /assets/ (images, PDFs, CV) keeps its stable file names across
        # builds, so a short cache lifetime avoids serving a stale file after
        # a deploy while still saving repeat-visit requests within a session.
        location /assets/ {
            root   /usr/share/nginx/html;
            expires 1h;
            add_header Cache-Control "public";
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        }

        # serve the Astro-generated 404 page for missing pages
        error_page 404 /404.html;
        location = /404.html {
            root   /usr/share/nginx/html;
            internal;
        }

    }
}
