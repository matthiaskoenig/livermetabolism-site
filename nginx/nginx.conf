user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 8192;

events {
  worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    server {
        listen 80;
        listen [::]:80;

        # site
        client_max_body_size 100m;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # Jekyll's asset filenames aren't fingerprinted/versioned per build,
        # so a short cache lifetime avoids serving a stale bundle after a
        # deploy while still saving repeat-visit requests within a session.
        location /assets/ {
            root   /usr/share/nginx/html;
            expires 1h;
            add_header Cache-Control "public";
        }

        # redirect server error pages to the static page /50x.html
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # serve the Jekyll-generated 404 page for missing pages
        error_page 404 /404.html;
        location = /404.html {
            root   /usr/share/nginx/html;
            internal;
        }

    }
}
