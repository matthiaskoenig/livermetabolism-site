user nginx;
worker_processes auto;
error_log /logs/error.log;
pid /var/run/nginx.pid;
worker_rlimit_nofile 8192;

events { 
  worker_connections 1024; 
}
 
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    keepalive_timeout  65;
    #include /etc/nginx/conf.d/*.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    # http forwards
    server {
      listen 80;
      listen [::]:80;

      #server_name www.livermetabolism.com livermetabolism.de www.livermetabolism.de liver-metabolism.com;
      server_name _;

      # letsencrypt webroot authenticator
      location /.well-known/acme-challenge/ {
          root /usr/share/nginx/letsencrypt;
      }

      # https redirects
      location = / {
          return 301 https://livermetabolism.com$request_uri;
      }
    }

    # https forwards
    server {
      listen 443 ssl http2;
      listen [::]:443 ssl http2;

      server_name _;
      ssl_certificate     /etc/letsencrypt/live/livermetabolism.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/livermetabolism.com/privkey.pem;

      return 301 https://livermetabolism.com$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name livermetabolism.com;
        access_log /logs/livermetabolism.access.log;

        # https
        ssl_certificate     /etc/letsencrypt/live/livermetabolism.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/livermetabolism.com/privkey.pem;
        include /etc/nginx/snippets/ssl.conf;

        # site
        client_max_body_size 100m;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # Jekyll's asset filenames aren't fingerprinted/versioned per build,
        # so a short cache lifetime avoids serving a stale bundle after a
        # deploy while still saving repeat-visit requests within a session.
        location /assets/ {
            root   /usr/share/nginx/html;
            expires 1h;
            add_header Cache-Control "public";
        }

        # redirect server error pages to the static page /50x.html
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # serve the Jekyll-generated 404 page for missing pages
        error_page 404 /404.html;
        location = /404.html {
            root   /usr/share/nginx/html;
            internal;
        }

    }
}
