teaching.intro:
  sha: '0000000000000000'
  text: 'Willkommen auf unserer Lehrseite! Unser Fokus liegt auf projektbasiertem Lernen, das Studierende dazu befähigt, sich aktiv mit realen Herausforderungen in digitaler Gesundheit und partizipativer Entscheidungsfindung auseinanderzusetzen. Durch interdisziplinäre Zusammenarbeit, innovative digitale Formate und ein starkes Engagement für Open Science und ethische Forschung schaffen wir praxisnahe, inklusive Lernumgebungen. Indem wir Nachwuchswissenschaftlerinnen und -wissenschaftler - insbesondere Frauen - fördern und digitale Kompetenzen integrieren, bereiten wir die nächste Generation von Fachkräften darauf vor, die Zukunft des Gesundheitswesens zu gestalten.'
