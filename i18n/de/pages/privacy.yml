rightsHeading:
  text: 5. Ihre Rechte
rightsText:
  text: >-
    Sie haben im Rahmen der geltenden gesetzlichen Bestimmungen jederzeit das Recht auf
    unentgeltliche Auskunft über Ihre gespeicherten personenbezogenen Daten, deren Herkunft und
    Empfänger und den Zweck der Datenverarbeitung sowie ein Recht auf Berichtigung, Sperrung oder
    Löschung dieser Daten sowie ein Recht auf Datenübertragbarkeit und ein Widerspruchsrecht gegen
    die Verarbeitung. Hierzu sowie zu weiteren Fragen zum Thema personenbezogene Daten können Sie
    sich jederzeit über die im Impressum genannte Kontaktmöglichkeit an uns wenden. Ihnen steht
    zudem ein Beschwerderecht bei der zuständigen Datenschutz-Aufsichtsbehörde zu.
