consentStorageText:
  text: >-
    Ihre Auswahl im Banner wird im lokalen Speicher Ihres Browsers gespeichert, damit sie bei
    weiteren Seitenaufrufen berücksichtigt werden kann. Sie können die Auswahl über die Schaltfläche
    oben zurücksetzen oder durch Löschen der Website-Daten in Ihrem Browser entfernen. Das Banner
    steuert Google Analytics. Die im folgenden Abschnitt beschriebenen Schriftarten, Datenabrufe und
    YouTube-Inhalte werden unabhängig von dieser Auswahl geladen.
externalLinksHeading:
  text: 4. Externe Links und eingebundene Inhalte
externalResourcesText:
  text: >-
    Diese Website bindet auch Ressourcen externer Anbieter ein. Bei einem solchen Abruf stellt Ihr
    Browser eine direkte Verbindung zum jeweiligen Anbieter her. Dabei erhält dieser insbesondere
    Ihre IP-Adresse, die angeforderte Ressource und technische Informationen, die Ihr Browser
    übermittelt, etwa zum Browsertyp; je nach Browsereinstellungen kann auch die Herkunftsseite
    übermittelt werden. Diese Verbindungen können bereits beim Anzeigen einer Seite oder eines
    eingebundenen Inhalts entstehen, ohne dass Sie einen externen Link anklicken.
