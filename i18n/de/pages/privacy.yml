logfilesHeading:
  text: 2. Server-Logfiles
logfilesText:
  text: >-
    Beim Aufruf dieser Website erhebt der Hosting-Provider automatisch Informationen in sogenannten
    Server-Logfiles, die Ihr Browser automatisch übermittelt. Dies sind: Browsertyp und -version,
    verwendetes Betriebssystem, Referrer-URL, Hostname des zugreifenden Rechners, Uhrzeit der
    Serveranfrage und IP-Adresse. Diese Daten werden nicht mit anderen Datenquellen zusammengeführt
    und dienen ausschließlich der Sicherstellung eines störungsfreien Betriebs sowie der Sicherheit
    unserer informationstechnischen Systeme (Rechtsgrundlage: Art. 6 Abs. 1 lit. f DSGVO,
    berechtigtes Interesse).
analyticsHeading:
  text: 3. Google Analytics
analyticsIntro:
  text: >-
    Diese Website nutzt Google Analytics 4, einen Webanalysedienst der Google Ireland Limited,
    Gordon House, Barrow Street, Dublin 4, Irland („Google“) - aber nur, wenn Sie dem im
    Cookie-Banner beim ersten Besuch ausdrücklich zugestimmt haben. Ohne Ihre Zustimmung wird kein
    Google-Analytics-Skript geladen und es werden keine Analytics-Cookies gesetzt. Rechtsgrundlage
    ist in diesem Fall Ihre Einwilligung (Art. 6 Abs. 1 lit. a DSGVO i. V. m. § 25 Abs. 1 TDDDG).
analyticsCookiesText:
  text: >-
    Stimmen Sie zu, verwendet Google Analytics Cookies bzw. vergleichbare Technologien, die eine
    Analyse der Benutzung der Website durch Sie ermöglichen. Die dabei erzeugten Informationen (u.
    a. IP-Adresse, besuchte Seiten, Verweildauer, verwendetes Gerät) werden an einen Server von
    Google übertragen und dort verarbeitet; dies kann auch Server in den USA einschließen. Nach
    Angaben von Google wird die IP-Adresse bei der Erhebung zur Ableitung von Standortinformationen
    verwendet und anschließend verworfen, bevor die Daten gespeichert werden. Weitere Informationen
    bietet Google zur
