xresearch2022:
  title:
    sha: fd5c7b2eda761bea
    text: 'X-Student Research Group: Physiologiebasierte Modellierung von Arzneimitteln: ACE-Hemmer bei der Behandlung von Bluthochdruck'
  content:
    sha: 34a1ae39c8aceed8
    text: |2-

          <p>
          Eine zentrale Herausforderung bei der Behandlung von Menschen ist das Verständnis der Pharmakokinetik eines Arzneimittels, das heißt, wie es vom Körper resorbiert, verteilt, metabolisiert und eliminiert wird, sowie der Pharmakodynamik des Arzneimittels, das heißt, wie die Substanz den Körper beeinflusst. Physiologiebasierte pharmakokinetische (PBPK-)Modelle sind Computermodelle, die die Untersuchung der Pharmakokinetik und Pharmakodynamik von Arzneimitteln in silico ermöglichen. Im Rahmen dieser X-Student Research Group entwickeln wir gemeinsam mit den Studierenden PBPK-Modelle von ACE-Hemmern. Der methodische Ansatz ist eine Kombination aus Vorlesungen, Tutorien und praktischer Arbeit der Studierenden. Das Forschungsprojekt richtet sich an maximal 15 Studierende, vorrangig mit einem MINT-Hintergrund (Mathematik, Informatik, Naturwissenschaft und Technik), einschließlich Studierender der Biologie, Informatik und Medizin. Grundlegende Programmierkenntnisse in Python sind erforderlich.
          </p>
          <p>
          Mit den <a href="https://www.berlin-university-alliance.de/commitments/teaching-learning/sturop/research-groups/index.html">X-Student Research Groups</a> fördert die Berlin University Alliance Forschungsteams aus Nachwuchswissenschaftlerinnen und -wissenschaftlern sowie Studierenden. Ziel ist es, Studierende in aktuelle Forschungsprojekte der Allianzpartner einzubinden und ihnen zu ermöglichen, bereits während des Studiums an (Spitzen-)Forschung teilzunehmen.
          </p>
          <p>Die Berlin University Alliance fördert bis zu 32 X-Student Research Groups pro Jahr.</p>
          <ul>
            <li><a href="https://www.berlin-university-alliance.de/commitments/teaching-learning/sturop/research-groups/index.html">X-Student Research Groups</a></li>
            <li><a href="https://www.berlin-university-alliance.de/commitments/teaching-learning/sturop/research-groups/faq-groups/index.html">FAQ X-Student Research Groups</a></li>
            <li><a href="https://www.berlin-university-alliance.de/commitments/teaching-learning/sturop/research-groups/information/index.html">Weitere Informationen X-Student Research Group</a></li>
          </ul>
          
  caption:
    sha: 0527b1f87a6de519
    text: <strong>Physiologiebasiertes Pharmakokinetikmodell</strong> der ACE-Hemmer. Die Modelle untersuchen die Absorption (Magen-Darm-Trakt), Verteilung (systemischer Kreislauf), Metabolisierung (Leber) und Elimination (Nieren und Leber) der ACE-Hemmer Lisinopril und Ramipril. Organe und Plasmavolumina sind über den Blutfluss (Q) verbunden.
  funding:
    sha: 9f7418bce0e2403b
    text: Gefördert im Rahmen der Exzellenzstrategie des Bundes und der Länder durch die <a href="https://www.berlin-university-alliance.de/">Berlin University Alliance</a>.
