theory_tools_methods_ss25:
  title:
    sha: 571f2168cedcacb3
    text: Theorie, Werkzeuge und Methoden der Biologie
  content:
    sha: 86468314cedab75d
    text: |2-

          <p>
          In diesem Kurs und dieser Vorlesung werden wichtige Theorien, Werkzeuge und Methoden der Biologie vorgestellt.
          Unsere Gruppe war für das Teilmodul <b>pharmakokinetische Modellierung</b> verantwortlich; Informationen und Material sind verfügbar unter <a href="https://matthiaskoenig.github.io/dhpe-pkpd/">https://matthiaskoenig.github.io/dhpe-pkpd/</a>.
          </p>
          <p>Pharmakokinetische Modellierung ist die Untersuchung, wie Arzneimittel im Körper resorbiert, verteilt, metabolisiert und ausgeschieden werden. Der Kurs zur pharmakokinetischen Modellierung behandelt Themen wie pharmakokinetische Prinzipien, Arzneimittelverteilung, Clearance und Elimination sowie die Faktoren, die diese Prozesse beeinflussen. Studierende lernen verschiedene Modelle kennen, die zur Beschreibung der Pharmakokinetik verwendet werden, etwa Kompartimentmodelle und physiologiebasierte pharmakokinetische Modelle, sowie deren Einsatz zur Vorhersage von Arzneimittelkonzentrationen und zur Optimierung von Dosierungsschemata. Weitere Themen können Pharmakodynamik, Arzneimittelinteraktionen sowie die Anwendung der pharmakokinetischen Modellierung in der Arzneimittelentwicklung und der klinischen Praxis umfassen. Insgesamt vermittelt ein Kurs zur pharmakokinetischen Modellierung Studierenden ein umfassendes Verständnis der Prinzipien und Techniken zur Beschreibung der Bewegung von Arzneimitteln durch den Körper und wie dieses Wissen zur Verbesserung der Arzneimitteltherapie angewendet werden kann.
          </p>
          
  caption:
    sha: a78542a1d84bd130
    text: <strong>Theorie, Werkzeuge und Methoden der Biologie - Pharmakokinetische Modellierung</strong>
