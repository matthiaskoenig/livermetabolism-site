xresearch2023:
  title:
    sha: f0d5624af13e9401
    text: 'X-Student Research Group: Physiologiebasierte digitale Zwillinge für die Behandlung von Bluthochdruck mit ACE-Hemmern und Diuretika'
  content:
    sha: c06d7eb5fed531d9
    text: |2-

          <p>
          Das Verständnis der Pharmakokinetik eines Arzneimittels - wie es vom Körper resorbiert, verteilt, metabolisiert und ausgeschieden wird - und seiner Pharmakodynamik - wie es den Körper beeinflusst - ist eine zentrale Herausforderung bei der Behandlung von Menschen. Angiotensin-Converting-Enzym(ACE)-Hemmer und Diuretika sind zwei Arzneimittelklassen, die zur Behandlung von Bluthochdruck eingesetzt werden. Beide gehören aufgrund der hohen Prävalenz von Bluthochdruck in einer alternden Gesellschaft zu den am häufigsten verschriebenen Arzneimitteln.
          </p>
          <p>
          In dieser X-Student Research Group entwickeln wir physiologiebasierte pharmakokinetische Modelle des Diuretikums Hydrochlorothiazid und des ACE-Hemmers Lisinopril. Der methodische Ansatz ist eine Kombination aus Vorlesungen, Tutorien und praktischer Arbeit der Studierenden. Das Forschungsprojekt richtet sich an Studierende mit einem MINT-Hintergrund (Mathematik, Informatik, Naturwissenschaft und Technik), einschließlich Studierender der Biologie, Informatik und Medizin. Grundlegende Programmierkenntnisse in Python sind erforderlich.
          </p>
          <p>
          Mit den <a href="https://www.berlin-university-alliance.de/commitments/teaching-learning/sturop/research-groups/index.html">X-Student Research Groups</a> fördert die Berlin University Alliance Forschungsteams aus Nachwuchswissenschaftlerinnen und -wissenschaftlern sowie Studierenden. Ziel ist es, Studierende in aktuelle Forschungsprojekte der Allianzpartner einzubinden und ihnen zu ermöglichen, bereits während des Studiums an (Spitzen-)Forschung teilzunehmen.
          </p>
          
  caption:
    sha: 0f36e938e2cc8ff6
    text: <strong>Physiologiebasierte digitale Zwillinge </strong> für die Behandlung von Bluthochdruck mit ACE-Hemmern und Diuretika.
  funding:
    sha: 9f7418bce0e2403b
    text: Gefördert im Rahmen der Exzellenzstrategie des Bundes und der Länder durch die <a href="https://www.berlin-university-alliance.de/">Berlin University Alliance</a>.
