roman_schulte:
  description:
    sha: 2632036b78dd0208
    text: 'Im Rahmen seiner Bachelorarbeit wurde das Konzept einer Modular Research Environment (MRE) entwickelt. Eine MRE ist ein modulares Anwendungsframework, das durch Plugins zu einem neuen Werkzeug erweitert werden kann. InSilico ist die funktionsfähige Proof-of-Principle-Implementierung einer solchen MRE und wurde parallel zu dieser Arbeit entwickelt. Die geschaffene Infrastruktur von InSilico kann genutzt werden, um im Vergleich zum traditionellen Ansatz mit weniger Aufwand, Zeit und Ressourcen eigene Forschungswerkzeuge zu erstellen, zu teilen und wiederzuverwenden.'
  role:
    sha: 1da89968cf7e676a
    text:
      - 'Bachelorarbeit'
shalin_shah:
  description:
    sha: 9870b3c8fc2c12f4
    text: 'Die Systems Biology Simulation Core Library (SBSCL) bietet eine effiziente und umfassende Java™-Implementierung von Methoden zur Interpretation des Inhalts von Modellen, die in der Systems Biology Markup Language (SBML) kodiert sind, sowie deren numerische Lösung. Diese Bibliothek basiert auf dem JSBML-Projekt und kann auf jedem Betriebssystem verwendet werden, für das eine Java Virtual Machine verfügbar ist. Im Rahmen dieses Projekts wurde SBSCL unter anderem mit besserer Unterstützung für SED-ML und COMBINE-Archive erweitert. Siehe auch <a href="https://ssdoesgsoc.wordpress.com/" target="_blank">https://ssdoesgsoc.wordpress.com/</a>.'
  role:
    sha: a80987dec3013b9c
    text:
      - 'Google Summer of Code'
takahiro_yamada:
  description:
    sha: 9ca24771e5b783f2
    text: 'Im Rahmen dieses Projekts wurde als Teil des Google Summer of Code 2017 eine Web-App für SBML-Modelle implementiert, die Funktionen für Zeitverlaufssimulation, Steady-State-Analyse und Parameterschätzung bietet. Die Web-App bietet Möglichkeiten zum Hochladen von SBML-Modellen und experimentellen Datendateien und zur Durchführung der entsprechenden Simulationen mit den Modellen. Siehe auch <a href="https://gsoc2017developwebservice.blogspot.com/" target="_blank">https://gsoc2017developwebservice.blogspot.com/</a>.'
  role:
    sha: a80987dec3013b9c
    text:
      - 'Google Summer of Code'
