    text: 'Matthias König als neuer Professor an der Universität zu Lübeck begrüßt'
  short:
    sha: bc8e3228288f7692
    text: 'Matthias König nahm am 1. September 2026 gemeinsam mit anderen neu berufenen Professorinnen und Professoren am Welcome Day der Universität zu Lübeck teil, mit Campusprogramm und Abendempfang.'
  abstract:
    sha: 2ed63c19ddc81077
    text: '<p>Matthias König von der Ersten Medizinischen Klinik zählte zu den neu berufenen Professorinnen und Professoren, die am 1. September 2026 beim Welcome Day der Universität zu Lübeck vorgestellt wurden.</p> <p>Bei der Veranstaltung kamen 35 neue Professorinnen und Professoren sowie Mitarbeitende zu Vorstellungsrunden, Informationsveranstaltungen und einer Campusführung zusammen. Ein Abendempfang in der Gemeinnützigen in der historischen Altstadt Lübecks gab den neuen Professorinnen und Professoren Gelegenheit, ihre Arbeit und Forschung vorzustellen. Universitätspräsident Prof. Dr. Helge Braun begrüßte die neuen Kolleginnen und Kollegen, und Prof. Dr. Karl Klotz, Direktor der Gemeinnützigen, führte in den Abend ein.</p> <p><small>Foto: Olaf Malzahn, über die Universität zu Lübeck.</small></p>'
Sego2026_EFECT_publication:
  title:
    sha: 53f3608024377a61
    text: 'Publikation: EFECT Enables Reliable and Reproducible Stochastic Simulations Across Disciplines'
  short:
    sha: 7d9052ced31e4392
    text: 'Wir stellen EFECT vor, den Empirical Characteristic Function Equality Convergence Test, ein universelles statistisches Framework zur Quantifizierung der Reproduzierbarkeit stochastischer Simulationen in Systembiologie, Epidemiologie, Finanzwesen und maschinellem Lernen.'
  abstract:
    sha: 9f67d41f016f2787
    text: 'In einer neuen Publikation in npj Complexity stellen wir den Empirical Characteristic Function Equality Convergence Test (EFECT) vor, ein domänenunabhängiges Rechenframework zur Quantifizierung der statistischen Reproduzierbarkeit stochastischer Simulationen. Die Reproduzierbarkeit stochastischer Simulationen ist bekanntermaßen schwer zu beurteilen, da jeder Lauf unterschiedliche Ergebnisse liefert, und bestehende Praktiken, die sich auf das Teilen von Code, Seeds, Daten und Softwareumgebungen konzentrieren, stellen nicht sicher, dass Ergebnisse unabhängig reproduziert werden können. EFECT schließt diese Lücke, indem es einen normalisierten EFECT-Fehler definiert, der Verteilungsunterschiede zwischen zwei Sätzen von Simulationsergebnissen über einen modell- und skalenunabhängigen Bereich misst, zusammen mit einem EFECT-Konvergenzpunkt, der die minimale Stichprobengröße angibt, die zum Erreichen eines gewählten Reproduzierbarkeitsschwellenwerts und Signifikanzniveaus erforderlich ist. Die Methode gilt für jede Simulation, deren Ergebnisse als beschränkte, reellwertige Daten dargestellt werden können, unabhängig vom Modellierungsformalismus oder der Quelle der Stochastizität, und ist in einer Open-Source-Softwarebibliothek mit einem kompakten, maschinenlesbaren standardisierten Bericht implementiert. Das Framework wurde in mehr als 40 Testfällen aus den Bereichen stochastische Differentialgleichungen, agentenbasierte Modelle, Boolesche Netzwerke und partielle Differentialgleichungen umfassend evaluiert. Die Anwendung von EFECT auf publizierte Modelle aus der Pandemie-Epidemiologie, der stochastischen Finanzvolatilität und physikinformierten neuronalen Netzen zeigte, dass häufig verwendete Stichprobengrößen oft unterdimensioniert sind, wobei erhebliche Parameterunterschiede unentdeckt bleiben, wenn nicht Tausende von Replikaten simuliert werden. Durch die Bereitstellung einer wiederverwendbaren, domänenunabhängigen statistischen Reproduzierbarkeitsmetrik und eines standardisierten Berichtsformats bietet EFECT eine praktische Möglichkeit, quantitative Reproduzierbarkeits- und Replizierbarkeitsprüfungen in stochastische Simulations-Workflows über datenintensive Disziplinen hinweg zu integrieren.'
HIP2026_montelukast_Jessica.Cruz:
  title:
    sha: e0c0a8a9011d99b6
    text: 'Poster beim HIP Day 2026: Ein PBPK-Modell des Leukotrien-Rezeptor-Antagonisten Montelukast'
  short:
    sha: 7594788e157826d3
    text: 'Jessica Cruz Pérez stellt ihr Praktikumsprojekt vor, in dem sie ein physiologiebasiertes pharmakokinetisches (PBPK) Modell von Montelukast entwickelt, um die interindividuelle Variabilität der Pharmakokinetik zu untersuchen, einschließlich der Effekte des hepatischen Metabolismus, der CYP2C9/CYP3A4-Variabilität, von Arzneimittelinteraktionen, des Nahrungseffekts und gewichtsbedingter Unterschiede in erwachsenen Populationen.'
  abstract:
    sha: 27e54749a7dc296e
    text: 'Beim Humboldt Internship Program (HIP) Day 2026 in Berlin stellte Jessica Cruz Pérez ihr Poster zur Entwicklung eines physiologiebasierten pharmakokinetischen (PBPK) Modells von Montelukast vor, einem Leukotrien-Rezeptor-Antagonisten zur Behandlung von Asthma und allergischer Rhinitis. Das Projekt, das in der Gruppe von Matthias König an der Humboldt-Universität zu Berlin durchgeführt wird, zielt darauf ab, unser Verständnis der interindividuellen Variabilität der Montelukast-Pharmakokinetik zu verbessern, einschließlich der Effekte des hepatischen Metabolismus, der CYP2C9/CYP3A4-Variabilität, von Arzneimittelinteraktionen, des Nahrungseffekts und gewichtsbedingter Unterschiede in erwachsenen Populationen. Mithilfe von Zotero wurde eine systematische Literaturrecherche von über 100 Publikationen durchgeführt, und Studien wurden für die Datenkuratierung in PK-DB priorisiert. Die nächsten Schritte umfassen die Digitalisierung und Kuratierung des Datensatzes in PK-DB, die Implementierung des ODE-Modells in SBML, Modellsimulationen und Variabilitätsanalysen sowie die Modellevaluierung anhand publizierter klinischer Daten.'
Schwaiger2026_hctz:
  title:
    sha: a5255af6e225a5be
    text: 'Preprint: A Physiologically Based Pharmacokinetic/Pharmacodynamic Model of the Diuretic Hydrochlorothiazide'
  short:
    sha: 4ce4b0f2ba0d13d6
    text: 'Wir präsentieren ein Ganzkörper-PBPK/PD-Modell des Diuretikums Hydrochlorothiazid zur Untersuchung der pharmakokinetischen und pharmakodynamischen Variabilität bei hypertensiven Patientinnen und Patienten, mit Fokus auf renale, hepatische und kardiale Beeinträchtigungen.'
  abstract:
    sha: e6abc6bb57d9606f
    text: 'In einem neuen Preprint stellen Amanda Schwaiger und Matthias König ein Ganzkörper-physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell des Thiazid-Diuretikums Hydrochlorothiazid (HCTZ) vor, das orale Absorption, systemische Verteilung, renale Elimination, renalen Natrium-, Chlorid- und Flüssigkeitshaushalt sowie die Blutdruckregulation integriert. Das Modell wurde anhand kuratierter PK- und PD-Daten aus 25 klinischen Studien an gesunden Personen sowie Patientinnen und Patienten mit Hypertonie, kardialer, hepatischer oder renaler Beeinträchtigung kalibriert und evaluiert. Die Modellvorhersagen stimmten mit den beobachteten dosisproportionalen PK- und PD-Daten überein und erfassten die Variabilität der HCTZ-Exposition und -Wirkung über simulierte Komorbiditäten hinweg. Eine renale Beeinträchtigung erwies sich als Hauptursache für eine veränderte HCTZ-Exposition und eine verringerte renale Ausscheidung, während hepatische und kardiale Beeinträchtigungen die PK vor allem über sekundäre Effekte auf die Nierenfunktion beeinflussten und nicht durch direkte Effekte auf Metabolismus oder Absorption. Das Modell liefert einen mechanistischen Rahmen zum Verständnis der HCTZ-Pharmakologie über heterogene klinische Bedingungen hinweg und kann zu einer individualisierten antihypertensiven Therapie bei Patientinnen und Patienten mit Komorbiditäten beitragen.'
PAGE2026_PKDB_Myshkina_Koenig:
  title:
    sha: ff1ca24896cc8ce4
    text: 'Poster beim PAGE 2026: PK-DB 2.0 für pharmakometrische Modellierung, KI und digitale Zwillinge'
  short:
    sha: 22e26f49be104d09
    text: 'Wir präsentieren PK-DB 2.0, eine offene, FAIR und KI-taugliche Datenbank für Pharmakokinetik und Pharmakodynamik, die kuratierte PK/PD-Daten aus mehr als 700 klinischen Studien für pharmakometrische Modellierung, maschinelles Lernen und die Entwicklung digitaler Zwillinge bereitstellt.'
  abstract:
    sha: 6269f20b042a56a0
    text: 'Bei der PAGE 2026 in Dubrovnik präsentiert Mariia Myshkina PK-DB 2.0, eine offene Pharmakokinetik- und Pharmakodynamik-Datenbank für moderne pharmakometrische Modellierung, KI-gestützte Workflows und Anwendungen digitaler Zwillinge. PK-DB 2.0 stellt eine einheitliche, maschinenlesbare Dateninfrastruktur bereit, die Studiendesigns, Interventionen, Konzentrations-Zeit-Profile, abgeleitete pharmakokinetische Parameter und pharmakodynamische Endpunkte umfasst. Die Plattform enthält derzeit kuratierte Daten aus mehr als 700 klinischen Studien und führt strengere Validierungsregeln, automatisierte Qualitätsprüfungen, Einheitennormalisierung, ontologiebasierte semantische Annotationen sowie eine explizite Darstellung experimenteller Unsicherheiten ein. Eine neu gestaltete REST-API ermöglicht einen schnellen und zuverlässigen programmatischen Zugriff, während ein dedizierter Model-Context-Protocol-(MCP)-Server strukturierten Zugriff für KI-Clients und automatisierte Modellierungs-Workflows bietet. Durch die Kombination aus sorgfältiger Kuratierung, FAIR-Datenprinzipien und KI-tauglichen Schnittstellen unterstützt PK-DB 2.0 reproduzierbare Modellentwicklung, studienübergreifende Analysen, Machine-Learning-Pipelines, PBPK-Modellierung, Populationspharmakometrie und digitale-Zwillinge-gestützte Entscheidungsunterstützung der nächsten Generation.'
Myshkina2026_apixaban_preprint:
  title:
    sha: 7bc3d2d67953d81d
    text: 'Preprint: An Open and Reproducible Digital Twin for Personalised Anticoagulant Therapy'
  short:
    sha: 2d51871cd4e23590
    text: 'Wir präsentieren einen offenen Ganzkörper-PBPK/PD-digitalen Zwilling von Apixaban zur Untersuchung der pharmakokinetischen und pharmakodynamischen Variabilität in der personalisierten Antikoagulanzientherapie, mit Fokus auf renale und hepatische Beeinträchtigung, Nahrungsaufnahme, Körpergewicht, Metaboliten und gerinnungsbezogene Endpunkte.'
  abstract:
    sha: 167edaa15f2ff225
    text: 'In einem neuen Preprint stellen Mariia Myshkina, Mariia Babaeva, Linh Chang Nguyen, Shelee Bedón, Johannes Metternich, Michelle Elias und Matthias König einen offenen PBPK/PD-digitalen Zwilling von Apixaban für die personalisierte Antikoagulanzientherapie vor. Das Modell wurde anhand von 35 kuratierten klinischen PK/PD-Studien entwickelt und erfasst die Apixaban-Exposition sowie gerinnungsbezogene pharmakodynamische Endpunkte über verschiedene Dosierungsschemata, renale und hepatische Beeinträchtigung, Nahrungsaufnahme und Körpergewicht hinweg. Alle Modelldateien, Simulations-Workflows und kuratierten Datensätze sind gemäß den FAIR-Prinzipien offen unter MIT- und CC-BY-Lizenzen verfügbar. Die Arbeit entstand im Rahmen der X-Student Research Group „Digital Twins in Action: Optimizing Direct Oral Anticoagulant Use“ der Berlin University Alliance (BUA), gefördert durch das Bundesministerium für Bildung und Forschung (BMBF) und das Land Berlin im Rahmen der Exzellenzstrategie von Bund und Ländern.'
Bafna2025_segmentation_preprint:
  title:
    sha: aca55cb28d86c9d8
    text: 'Automated Segmentation of Hepatic Vessels and Lobules in Whole-Slide Images Using U-Net Models'
  short:
    sha: 2de4d1fc00da3526
    text: 'Unsere neueste Publikation stellt eine Deep-Learning-Pipeline zur automatisierten Segmentierung hepatischer Gefäße, Gallengänge und Läppchen in Ganzschnittbildern der Leberhistologie vor.'
  abstract:
    sha: 201034b079037906
    text: 'Die automatisierte Analyse hepatischer Gefäßstrukturen und Läppchen in histologischen Ganzschnittbildern ist für die computergestützte Leberhistologie von zentraler Bedeutung. In dieser Arbeit stellen Bafna, König, Saalfeld, Moulisova, Liska, Dahmen und Albadry eine robuste Deep-Learning-Pipeline vor, die auf U-Net-Modellen mit adaptiver Patch-Extraktion und gewichtsverstärkten nnU-Net-Architekturen basiert. Das Framework segmentiert Läppchen (Dice 0,960), Zentralvenen (0,801), Leberarterien (0,909), Pfortadern (0,609) und Gallengänge (0,710) in gefärbten Schweineleberschnitten mit hoher Genauigkeit und unterstützt dabei morphometrische Analysen struktureller Merkmale. Die Studie zeigt das Potenzial anpassungsfähiger Segmentierungsmodelle zur Verbesserung von Präzision, Reproduzierbarkeit und Skalierbarkeit in der computergestützten Histopathologie.'
master_thesis_antonio.alvarez:
  title:
    sha: 5b0be262be60ba44
    text: 'Masterarbeit Antonio Alvarez'
  short:
    sha: 53845bcc93a81445
    text: 'Antonio Alvarez reichte seine Masterarbeit zu reproduzierbarer Bayes''scher Optimierung und Unsicherheitsquantifizierung in pharmakokinetischen Modellen ein'
  abstract:
    sha: d0c5c21a273dc6c4
    text: 'Antonio Alvarez entwickelte ein reproduzierbares Bayes''sches Framework zur Parameterschätzung in pharmakokinetischen (PK) und physiologiebasierten pharmakokinetischen (PBPK) Modellen. Anhand von drei Modellen zunehmender Komplexität untersuchte er systematisch, wie zentrale Hyperparameter die Leistung der Bayes''schen MCMC-Verfahren auf synthetischen Datensätzen beeinflussen. Die Studie zeigt, dass die Wahl der Priorverteilung der entscheidende Faktor für eine genaue Parameterrückgewinnung ist, während andere Einstellungen vor allem die Rechenkosten beeinflussen. Der vollständig offene und FAIR-konforme Workflow bietet eine robuste Grundlage für Unsicherheitsquantifizierung und reproduzierbare PBPK-Modellierung.'
Alejandro2026_empagliflozin_preprint:
  title:
    sha: 281894f296256e4d
    text: 'Preprint: A Digital Twin of Empagliflozin Pharmacokinetics and Pharmacodynamics'
  short:
    sha: bcda2ef99543d078
    text: 'Wir präsentieren einen Ganzkörper-PBPK/PD-digitalen Zwilling von Empagliflozin zur Untersuchung der pharmakokinetischen und pharmakodynamischen Variabilität bei Typ-2-Diabetes mellitus, mit Fokus auf renale und hepatische Beeinträchtigung, Metabolitenexposition und dosisabhängige Effekte.'
  abstract:
    sha: 055761cd2efdddc3
    text: 'In einem neuen Preprint stellen Jennesse Alejandro, Michelle Elias, Mariia Babaeva und Matthias König einen physiologiebasierten PBPK/PD-digitalen Zwilling des SGLT2-Hemmers Empagliflozin vor, entwickelt anhand kuratierter Daten aus 27 klinischen Studien. Das Ganzkörpermodell bildet Absorption, Verteilung, Metabolismus und Ausscheidung mechanistisch ab und verknüpft die Arzneimittelexposition explizit mit der renalen Glukoseverarbeitung über die renale Glukoseschwelle und die renale Glukoseausscheidung. Simulationen reproduzieren die dosisabhängige Pharmakokinetik und Pharmakodynamik über Einzel- und Mehrfachdosierungsschemata bei gesunden Personen sowie Patientinnen und Patienten mit Typ-2-Diabetes. Das Modell erfasst die Variabilität unter renaler und hepatischer Beeinträchtigung sowie unter nüchternen und nicht nüchternen Bedingungen und liefert damit quantitative Einblicke in klinisch relevante Szenarien. Alle Modelle, Datensätze und Simulations-Workflows werden als offene, FAIR-konforme SBML-Ressourcen bereitgestellt, was reproduzierbare Analysen und die Wiederverwendung für die modellgestützte Bewertung der PK/PD-Variabilität von Empagliflozin ermöglicht.'
prmt_digital_twins:
  title:
    sha: 4696671ac3fd70bb
    text: 'Keynote: Digitale Zwillinge und Dashboards für die personalisierte Arzneimitteltherapie'
  short:
    sha: 02bca1d87cb1233d
    text: 'Beim Patient Monitoring Roundtable (PMRT) an der Charité – Universitätsmedizin Berlin habe ich vorgestellt, wie digitale Zwillinge und interaktive Dashboards die personalisierte Arzneimitteltherapie und klinische Entscheidungsfindung unterstützen können.'
  abstract:
    sha: 79cbea9b944d7a75
    text: 'Digitale Zwillinge etablieren sich zunehmend als leistungsfähiges Konzept in der datengetriebenen und personalisierten Medizin. Beim Patient Monitoring Roundtable (PMRT) an der Charité – Universitätsmedizin Berlin hielt ich eine Keynote darüber, wie mechanistische Rechenmodelle und interaktive Dashboards genutzt werden können, um individualisierte Arzneimittelreaktionen zu simulieren und die klinische Entscheidungsfindung zu unterstützen. Der Vortrag stellte digitale Zwillinge in der Pharmakokinetik vor, basierend auf physiologiebasierten pharmakokinetischen (PBPK) Modellen, die die menschliche Physiologie in silico abbilden und simulieren, wie Arzneimittel absorbiert, verteilt, metabolisiert und eliminiert werden. Anhand von Beispielen wie digitalen Zwillingen von Glimepirid und Modellen der Leberfunktion zeigte ich, wie patientenspezifische Faktoren - darunter Genetik, Leberfunktion, Niereninsuffizienz und Körpergewicht - die Arzneimittelexposition und die Behandlungsergebnisse beeinflussen können. Interaktive Dashboards ermöglichen es Klinikerinnen und Klinikern sowie Forschenden, diese Modelle intuitiv zu erkunden, Szenarien zu testen, Risiken vorherzusagen und gemeinsam mit Patientinnen und Patienten Entscheidungen zu treffen. Im Anschluss an die Sitzung fanden interaktive Workshops statt, in denen die Teilnehmenden digitale Zwillinge und Dashboards diskutierten. Vielen Dank an die Organisatorinnen und Organisatoren sowie die Mitvortragenden für eine großartige Veranstaltung und inspirierende Diskussionen über die Zukunft der datengetriebenen Gesundheitsversorgung.'
Tereshchuk2026_canagliflozin_preprint:
  title:
    sha: 578ef60da4e8a1e7
    text: 'Preprint: A Digital Twin of Canagliflozin Pharmacokinetics and Pharmacodynamics in Type 2 Diabetes Mellitus'
  short:
    sha: 765496eaa72aaed0
    text: 'Wir präsentieren einen Ganzkörper-PBPK/PD-digitalen Zwilling von Canagliflozin zur Untersuchung der pharmakokinetischen und pharmakodynamischen Variabilität bei Typ-2-Diabetes mellitus, mit Fokus auf renale und hepatische Beeinträchtigung, Metabolitenexposition und dosisabhängige Effekte.'
  abstract:
    sha: b8b3740c29456dfd
    text: 'In einem neuen Preprint stellen Vera Tereshchuk, Michelle Elias und Matthias König einen physiologiebasierten PBPK/PD-digitalen Zwilling des SGLT2-Hemmers Canagliflozin vor, entwickelt anhand kuratierter Daten aus 22 klinischen Studien. Das Ganzkörpermodell bildet Absorption, Verteilung, Metabolismus und Ausscheidung mechanistisch ab und verknüpft die Arzneimittelexposition explizit mit der renalen Glukoseverarbeitung und der renalen Glukoseausscheidung. Simulationen reproduzieren die dosisabhängige Pharmakokinetik und Pharmakodynamik über Einzel- und Mehrfachdosierungsschemata bei gesunden Personen sowie Patientinnen und Patienten mit Typ-2-Diabetes. Eine renale Beeinträchtigung führt zu moderaten Veränderungen der Exposition der Muttersubstanz, jedoch zu einer deutlich verringerten renalen Glukoseausscheidung und einer erhöhten Metabolitenexposition, was mit einer eingeschränkten Glukosefiltration und -clearance übereinstimmt. Bei hepatischer Beeinträchtigung sagen die Simulationen eine erhöhte Canagliflozin-Exposition mit veränderten Metabolitenprofilen voraus, während die pharmakodynamischen Effekte minimal bleiben. Alle Modelle, Datensätze und Simulations-Workflows werden als offene, FAIR-konforme SBML-Ressourcen bereitgestellt, was reproduzierbare Analysen und die Wiederverwendung für die modellgestützte Bewertung der PK/PD-Variabilität von Canagliflozin ermöglicht.'
Koenig2026_GI_digital_twins_interview:
  title:
    sha: 2d0fc1f79850b9a7
    text: 'Interview: Modelle so komplex wie der Körper selbst – Digitale Zwillinge in der Medizin'
  short:
    sha: 19c52206ea417661
    text: 'In einem Interview mit Matthias König beleuchtet die Gesellschaft für Informatik, wie digitale Zwillinge so komplex werden wie der menschliche Körper selbst und wie sie personalisierte Vorhersage, Simulation und Entscheidungsunterstützung in der Medizin ermöglichen.'
  abstract:
    sha: fdc82f5fdbd99087
    text: 'In diesem von der Gesellschaft für Informatik veröffentlichten Interview spricht Matthias König über das Konzept digitaler Zwillinge in der Medizin und darüber, wie zunehmend detaillierte Rechenmodelle die Komplexität des menschlichen Körpers über verschiedene Skalen hinweg abbilden können. Das Interview beleuchtet die Rolle der Systembiologie, der physiologiebasierten pharmakokinetischen und pharmakodynamischen Modellierung sowie datengetriebener Ansätze beim Aufbau prädiktiver digitaler Zwillinge für Organe und die Physiologie des gesamten Körpers. Zu den zentralen Anwendungsbereichen zählen die personalisierte Therapieoptimierung, die Arzneimittelentwicklung und die klinische Entscheidungsunterstützung. Das Gespräch geht zudem auf aktuelle Herausforderungen wie Modellvalidierung, Datenintegration, Interoperabilität und Reproduzierbarkeit ein und betont die Bedeutung offener, FAIR-konformer und gemeinschaftsgetragener Modellierungsstandards für die Zukunft der Präzisions- und Systemmedizin.'
Open_Science_Workshop2025:
  title:
    sha: 1510148cc298cf3a
    text: 'Erfolgreicher Open Science Workshop 2025'
  short:
    sha: c2db4ed3d4dd8e72
    text: 'Der Open Science Workshop 2025 brachte Teilnehmende aus der gesamten Berlin University Alliance für eine eintägige, praxisorientierte Einführung in reproduzierbare Forschung, FAIR-Daten und Open-Source-Workflows zusammen.'
  abstract:
    sha: 03018cd5a17dda1f
    text: 'Der Open Science Workshop 2025 war ein großer Erfolg und begrüßte eine vielfältige Gruppe von Teilnehmenden aus allen BUA-Universitäten. Der Workshop behandelte zentrale Aspekte offener und reproduzierbarer Forschung, darunter FAIR-Datenprinzipien, Versionskontrolle mit Git, transparente Workflows, Open-Source-Werkzeuge, computergestützte Reproduzierbarkeit und bewährte Verfahren für kollaborative Wissenschaft. Alle Workshop-Materialien - einschließlich Folien, praktischer Übungen und Codebeispielen - sind offen auf der Workshop-Website (https://matthiaskoenig.github.io/open-science-workshop) verfügbar, mit vollständigen Quelldateien und Datensätzen im öffentlichen GitHub-Repository (https://github.com/matthiaskoenig/open-science-workshop). Eine ausführliche Reflexion und Zusammenfassung des Workshops, einschließlich der Teilnehmendendemografie und der Lernergebnisse, ist hier verfügbar: https://matthiaskoenig.github.io/open-science-workshop/docs/workshop2025.html. Der Workshop förderte angeregte Diskussionen über die Zukunft von Open Science und unterstrich die Bedeutung von Transparenz, Zugänglichkeit und Reproduzierbarkeit in der modernen Forschung. Die Teilnehmenden berichteten von einem deutlich verbesserten Verständnis aller vorgestellten Technologien. Alle Teilnehmenden erhielten Teilnahmezertifikate.'
Koenig2025_KI_Teaching_Certificate:
  title:
    sha: 0dcc3768dfc15f42
    text: 'Abschluss des KI-Lehrzertifikats'
  short:
    sha: 52eaa8c719425995
    text: 'Erfolgreicher Abschluss des KI-Lehrzertifikats (200 AE) an der Humboldt-Universität zu Berlin, das Grundlagen der KI, Ethik und Hochschuldidaktik im Rahmen von KI-Campus 2.0 und der AI Skills Initiative umfasst.'
  abstract:
    sha: 3cb5b42443e2564d
    text: 'Matthias König hat das KI-Lehrzertifikat erfolgreich abgeschlossen, ein umfassendes hochschuldidaktisches Qualifizierungsprogramm im Umfang von 200 Arbeitseinheiten, das im Rahmen von KI-Campus 2.0 und der AI Skills Initiative an der Humboldt-Universität zu Berlin angeboten wird. Das Zertifikat besteht aus drei Micro-Credentials - AI Foundations (96 %), AI Advanced & Ethics (93 %) und AI Didactics in Higher Education (91 %) - und deckt zentrale KI-Themen ab, darunter maschinelles Lernen, neuronale Netze, Python- und Jupyter-Workflows, Text- und Bildverarbeitung sowie verantwortungsvolle KI-Nutzung. Die Ausbildung folgte DGHD-konformen Standards in KI-Ethik, Daten- und Algorithmen-Governance sowie regulatorischen Aspekten. Das Programm legte zudem Schwerpunkte auf KI-gestützte Lehre, etwa die Integration generativer KI, Sprachassistenten und Prompt-Design in Hochschulkurse, sowie die Entwicklung KI-basierter OER-Lehreinheiten. Die Zertifizierung wurde mit einer Lehrhospitation und reflektierenden Bewertungen abgeschlossen, die die Kompetenz im Entwerfen und Umsetzen KI-gestützter Lernszenarien nachwiesen.'
huinternship2026:
  title:
    sha: f85b7dad0e530f59
    text: 'Humboldt Internship Program 2026 - Computergestützte Modellierung der Arzneimittelentgiftung mit digitalen Zwillingen – Ein systemmedizinischer Ansatz'
  short:
    sha: 6e369f9d76287fd2
    text: 'Wir bieten Praktika im Jahr 2026 an, dreimonatige akademische Forschungsaufenthalte an der Humboldt-Universität zu Berlin. Die Bewerbung für die Summer Term Internships 2026 ist vom 5. November bis 18. Dezember 2025 möglich.'
  abstract:
    sha: 86a9f99da0be9af6
    text: 'Das Humboldt Internship Program ist ein internationales Kurzzeitprogramm für fachspezifisches, erfahrungsbasiertes Lernen. Es ermöglicht Teilnehmenden, drei Monate lang in Teams an Forschungsprojekten und universitätsnahen Start-ups mitzuarbeiten.<br /><br /> Das Programm richtet sich an fortgeschrittene Bachelor- und Masterstudierende sowie Promovierende. Wählen Sie aus Projekten in verschiedenen akademischen Bereichen, erhalten Sie individuelle Beratung und erwerben Sie ECTS-Leistungspunkte. Einige Projekte bieten auch Online-Praktika an. Details entnehmen Sie bitte den einzelnen Projektbeschreibungen.<br /><br /> Die Summer Term Internships finden von Mai bis September 2025 statt. Weitere Informationen unter <a href="https://hic.hu-berlin.de/en/internship-program">https://hic.hu-berlin.de/en/internship-program</a>.'
Nemitz2025_dapagliflozin_preprint:
  title:
    sha: 3f810f0f021f9e87
    text: 'A Digital Twin of Dapagliflozin Pharmacokinetics and Pharmacodynamics in Type 2 Diabetes Mellitus'
  short:
    sha: 20a62c0a13da126d
    text: 'Wir präsentieren einen physiologiebasierten PBPK/PD-digitalen Zwilling von Dapagliflozin zur Analyse der pharmakokinetischen und pharmakodynamischen Variabilität bei Typ-2-Diabetes mellitus, mit Fokus auf Dosierung, hepatorenale Beeinträchtigung und Nahrungseffekte.'
  abstract:
    sha: 85816f42668cc21b
    text: 'In einem neuen Preprint stellen Nike Nemitz, Michelle Elias und Matthias König einen digitalen Zwilling des SGLT2-Hemmers Dapagliflozin vor, entwickelt als Ganzkörper-PBPK/PD-Modell auf Basis kuratierter Daten aus 28 klinischen Studien. Das Modell beschreibt mechanistisch die Absorption, Verteilung, den Metabolismus und die Ausscheidung des Arzneimittels sowie seine pharmakodynamische Wirkung über die renale Glukoseausscheidung. Es erfasst zentrale Quellen interindividueller Variabilität - darunter renale und hepatische Beeinträchtigung, Nahrungseffekte und dosisabhängige Kinetik - und reproduziert erfolgreich beobachtete klinische PK/PD-Muster. Simulationen zeigen, dass eine renale Beeinträchtigung die renale Glukoseausscheidung trotz erhaltener Plasmaexposition erheblich verringert, während eine hepatische Beeinträchtigung nur einen geringen Einfluss hat. Nahrungsaufnahme senkt die Spitzenkonzentrationen, führt jedoch weiterhin zu messbaren Veränderungen der pharmakodynamischen Reaktion. Dieser digitale Zwilling liefert mechanistische Einblicke in die Variabilität von Dapagliflozin und unterstützt die individualisierte Therapieoptimierung bei Typ-2-Diabetes.'
bua_faces_interview:
  title:
    sha: 6c04e197d8113cd8
    text: 'Faces of the Berlin University Alliance'
  short:
    sha: d10b44b12bfecfde
    text: 'Ich fühle mich sehr geehrt, in der neuen Filmreihe vertreten zu sein, die anlässlich des 6. Jubiläums der Berlin University Alliance (BUA) gestartet wurde. Sehen Sie mein Kurzporträt: <a href="https://www.youtube.com/watch?v=tb9QArwsYCg">🎥</a>. Erfahren Sie mehr über die Berlin University Alliance: <a href="https://www.youtube.com/watch?v=fyX7YAxsfw4">🎥</a>.'
  abstract:
    sha: 327225f4247a422b
    text: 'Ich fühle mich sehr geehrt, in der neuen Filmreihe vertreten zu sein, die anlässlich des 6. Jubiläums der Berlin University Alliance (BUA) gestartet wurde - der Forschungsallianz der FU Berlin, HU Berlin, TU Berlin und der Charité – Universitätsmedizin Berlin. Die Reihe stellt Forschende vor, die institutions-, disziplin- und bereichsübergreifend zusammenarbeiten, um Berlin als Ort des Wissens und der Innovation zu gestalten. Sie zeigt, wie Zusammenarbeit neue Ideen hervorbringt - von der molekularen Forschung bis zur Kulturwissenschaft, von der klinischen Praxis bis zu digitalen Infrastrukturen. In meinem Porträt spreche ich über unsere Arbeit an digitalen Zwillingen der Leber - Rechenmodelle, die Physiologie, Pharmakokinetik und klinische Daten integrieren, um personalisierte Medizin, Lehre und Open Science zu unterstützen.<br /> Sehen Sie mein Kurzporträt: <a href="https://www.youtube.com/watch?v=tb9QArwsYCg">🎥</a><br /> Erfahren Sie mehr über die Berlin University Alliance: <a href="https://www.youtube.com/watch?v=fyX7YAxsfw4">🎥</a><br /> Vielen Dank an alle Beteiligten sowie an die Studierenden, Mitarbeitenden und Kolleginnen und Kollegen, die diese Forschung jeden Tag möglich machen.'
Tensil2025_losartan_preprint:
  title:
    sha: f12c53482a0a006c
    text: 'Digitaler Zwilling von Losartan für die präzise Blutdrucktherapie'
  short:
    sha: fbe2e5fff37f5f74
    text: 'Wir stellen ein physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell von Losartan und seinem aktiven Metaboliten E3174 als digitalen Zwilling vor, um die Variabilität der Blutdruckregulation zu untersuchen und eine individualisierte antihypertensive Therapie zu unterstützen.'
  abstract:
    sha: fdc0b60633d2dc26
    text: 'In einem neuen Preprint präsentieren Ennie Tensil und Matthias König einen digitalen Zwilling des Angiotensin-II-Rezeptorblockers Losartan, der einen mechanistischen Rahmen für die präzise Behandlung von Hypertonie und Herzinsuffizienz bietet. Das Ganzkörper-PBPK/PD-Modell, basierend auf Daten aus 24 klinischen Studien, beschreibt die Absorption, den hepatischen Metabolismus, die renale Ausscheidung und die pharmakodynamischen Effekte von Losartan über das Renin-Angiotensin-Aldosteron-System (RAAS). Das in SBML implementierte Modell erfasst die interindividuelle Variabilität, die durch hepatische und renale Beeinträchtigung sowie CYP2C9- und ABCB1-Polymorphismen entsteht. Simulationen reproduzieren zentrale pharmakokinetische und pharmakodynamische Muster und verdeutlichen den Einfluss genetischer und physiologischer Faktoren auf das therapeutische Ansprechen. Dieser digitale Zwilling ermöglicht virtuelle Patientenstudien und liefert eine quantitative Grundlage für individualisierte Dosierung und präzise kardiovaskuläre Therapie.'
presentation_combine:
  title:
    sha: 076043673d2c7d27
    text: 'COMBINE & RDA: Reproducibility by Design: Data and Workflows for Pharmacokinetic Digital Twins'
  short:
    sha: a3dfdf566e187e30
    text: 'Präsentation bei COMBINE2025 und der RDA-Versammlung unseres Ansatzes für reproduzierbare digitale Zwillinge.'
  abstract:
    sha: 1e94ca18efa8fa4b
    text: 'Dr. Matthias König (Humboldt-Universität zu Berlin) zeigt, wie Reproduzierbarkeit und offene Standards vertrauenswürdige digitale Zwillinge in Pharmakologie und Medizin ermöglichen. Am Beispiel des digitalen Zwillings von Glimepirid für Typ-2-Diabetes demonstriert er: - Wie patientenspezifische Daten, Genetik und Physiologie individualisierte Arzneimittelreaktionen prägen - Wie offene Standards (SBML, SED-ML, PEtab, OMEX) Interoperabilität sicherstellen - Wie Executable Simulation Models (EXSIMO) Modell, Daten und Code für vollständige Transparenz zusammenführen - Unabhängige Reproduzierbarkeitsprüfungen durch das Physiome Journal und das BioModels Team Mehr entdecken:<br /> 🌐 <a href="https://livermetabolism.com">https://livermetabolism.com</a><br /> 💊 <a href="https://glimepiride.de">https://glimepiride.de</a><br /> 📦 Code: <a href="https://github.com/matthiaskoenig/glimepiride-model">https://github.com/matthiaskoenig/glimepiride-model</a><br /> 📄 Publikationen:<br /> - Elias M., König M. Front. Pharmacol. (2025) 16:1686415, <a href="https://doi.org/10.3389/fphar.2025.1686415">https://doi.org/10.3389/fphar.2025.1686415</a><br /> - Elias M., König M. Physiome* (2025) doi: <a href="https://doi.org/10.36903/physiome.28379193">https://doi.org/10.36903/physiome.28379193</a><br /> Folien: <a href="https://docs.google.com/presentation/d/e/2PACX-1vQ93_XwINeHqL4eOK8V7zfwn8ZGvsEw1uHZ3Ka1cECuq6_ir46RgQu4QSgQuLxBrkUu7MEKxHsJ_FAi/pub?start=false&loop=false&delayms=3000">https://docs.google.com/presentation/d/e/2PACX-1vQ93_XwINeHqL4eOK8V7zfwn8ZGvsEw1uHZ3Ka1cECuq6_ir46RgQu4QSgQuLxBrkUu7MEKxHsJ_FAi/pub?start=false&loop=false&delayms=3000</a><br /> Biomodels: <a href="https://www.ebi.ac.uk/biomodels/MODEL2510140001">https://www.ebi.ac.uk/biomodels/MODEL2510140001</a><br /> Youtube: <a href="https://youtu.be/IvKvApzjGtM">https://youtu.be/IvKvApzjGtM</a><br /> <br /> Präsentiert bei: COMBINE2025<br /> <a href="https://co.mbine.org/events/">https://co.mbine.org/events/</a><br /> #DigitalTwins #Reproducibility #OpenScience #Pharmacokinetics #SBML #COMBINE #SystemsMedicine #FAIRdata #AIinHealthcare #RDA'
Elias2025_glimepiride:
  title:
    sha: 863b5c7dc407d78e
    text: 'Digitaler Zwilling von Glimepirid ermöglicht personalisierte Diabetestherapie'
  short:
    sha: 1d80b70a002a1d56
    text: 'Wir präsentieren einen digitalen pharmakokinetischen Zwilling von Glimepirid, der simuliert, wie patientenspezifische Faktoren das Arzneimittelverhalten beeinflussen, und damit eine individualisierte und stratifizierte Behandlung von Typ-2-Diabetes unterstützt.'
  abstract:
    sha: 7e18ae7ffe800024
    text: 'In einer neuen Publikation stellen Michelle Elias und Matthias König ein physiologiebasiertes pharmakokinetisches (PBPK) Ganzkörpermodell von Glimepirid als digitalen Zwilling für die präzise Diabetesversorgung vor. Das anhand kuratierter Daten aus 19 klinischen Studien entwickelte Modell erfasst die ADME-Prozesse von Glimepirid und integriert quantitativ zentrale Quellen interindividueller Variabilität - darunter Leber- und Nierenfunktion, CYP2C9-Genotyp und Körpergewicht. Der digitale Zwilling bildet die beobachtete Pharmakokinetik präzise ab und zeigt, wie genetische und physiologische Faktoren die Arzneimittelexposition deutlich verändern können. Durch die Ermöglichung virtueller Patientensimulationen bietet dieses Modell eine mechanistische Plattform für personalisierte Dosierung und Patientenstratifizierung und treibt digitale Entscheidungsunterstützungswerkzeuge für eine wirksamere und individualisiertere Behandlung von Typ-2-Diabetes voran.'
myshkina2025_ai_dt_survey:
  title:
    sha: fb6d886f0a4e557a
    text: 'Assessing the Impact of AI and Digital Twins on Clinical Decision-Making in Hepatology and Hepatobiliary Surgery'
  short:
    sha: e9cb45cb59b66207
    text: 'Unser neuester Preprint präsentiert die Ergebnisse einer Befragungsstudie darüber, wie Klinikerinnen und Kliniker in Hepatologie und hepatobiliärer Chirurgie künstliche Intelligenz (KI) und digitale Zwillinge in der klinischen Entscheidungsfindung wahrnehmen, und beleuchtet dabei sowohl die Begeisterung für Innovation als auch Bedenken hinsichtlich Vertrauen, Haftung und Regulierung.'
  abstract:
    sha: eef552b0f1203301
    text: 'Künstliche Intelligenz (KI) und digitale Zwillinge (DT) stehen davor, die klinische Entscheidungsfindung in Hepatologie und hepatobiliärer Chirurgie zu verändern, doch ihre Akzeptanz hängt vom Vertrauen der Klinikerinnen und Kliniker sowie von regulatorischer Klarheit ab. Wir führten eine Online-Befragung unter 18 Fachärztinnen und Fachärzten durch, darunter Hepatologinnen und Hepatologen, hepatobiliäre Chirurginnen und Chirurgen sowie weitere Klinikerinnen und Kliniker, um Vertrautheit, wahrgenommenen Nutzen, den Einsatz klinischer Entscheidungsunterstützungssysteme (CDSS), Bedenken hinsichtlich Automatisierungsverzerrung und Haftung sowie die Einstellung zur patientenzentrierten Integration zu erfassen. Die Ergebnisse zeigten einen hoch wahrgenommenen Nutzen von KI (80 %) und DT (79 %), wobei 93 % über aktuelle oder geplante CDSS-Nutzung berichteten. Allerdings äußerten 71 % der Befragten Bedenken hinsichtlich Automatisierungsverzerrung, und 92 % waren sich über den rechtlichen Schutz unsicher. Bemerkenswerterweise befürworteten 77 % die Einbindung von Patientenpräferenzen in KI- und DT-gestützte Entscheidungsfindung. Unsere Ergebnisse zeigen ein starkes Interesse an der Einführung von KI und DT, aber auch erhebliche Vorsicht, was die Notwendigkeit klarer Leitlinien, klinischer Validierung und patientenzentrierter Rahmenwerke für eine sichere und wirksame Integration in die klinische Praxis unterstreicht.'
leadership_certificate:
  title:
    sha: 41d3fba6743cba35
    text: 'Dr. Matthias König schließt Leadership-Zertifikat erfolgreich ab'
  short:
    sha: 978523ec5640cd80
    text: 'Dr. Matthias König hat das umfassende Leadership-Zertifikat der Berlin Leadership Academy erfolgreich abgeschlossen und damit seine Führungskompetenzen für die Leitung von Forschungsteams und die Förderung effektiver Zusammenarbeit in der Wissenschaft gestärkt.'
  abstract:
    sha: df63dadb22f60917
    text: 'Dr. Matthias König hat das Leadership-Zertifikat für Juniorprofessorinnen und Juniorprofessoren sowie Nachwuchsgruppenleiterinnen und Nachwuchsgruppenleiter an der Berlin Leadership Academy (BLA) der Berlin University Alliance erfolgreich abgeschlossen. Dieses intensive, zweistufige Programm unterstützt Teilnehmende, die erstmals Führungsverantwortung übernehmen, und widmet sich den besonderen Herausforderungen von Führung in Wissenschaft und Hochschule. Durch eine Kombination aus Workshops, interaktiven Übungen und fallbasierten Diskussionen behandelte das Programm Strategien für effektive Zusammenarbeit, die strukturierte Organisation von Forschungsteams, konstruktive Kommunikation über Hierarchieebenen hinweg sowie den Erhalt persönlicher Gesundheit und Resilienz in Führungsrollen. Mit dem Abschluss dieses Programms hat Dr. König seine Führungs- und Sozialkompetenzen weiter gestärkt und ist nun noch besser darauf vorbereitet, seine Forschungsgruppe und gemeinsame Projekte wirkungsvoller und selbstbewusster zu leiten.'
bachelor_ennie_tensil:
  title:
    sha: 2cac0fccd7f1c162
    text: 'Bachelorarbeit Ennie Tensil: Physiologiebasierte pharmakokinetische/pharmakodynamische Modellierung von Losartan'
  short:
    sha: f7b008ee749cdb50
    text: 'Diese Arbeit präsentiert ein physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell von Losartan und seinem Metaboliten E3174, das mechanistische Einblicke liefert, wie physiologische und genetische Faktoren die Therapie beeinflussen, und individualisierte Dosierungsstrategien unterstützt.'
  abstract:
    sha: 9d174efe3007e7b3
    text: 'Losartan ist ein Angiotensin-II-Rezeptorantagonist, der häufig zur Behandlung von Hypertonie und Herzinsuffizienz eingesetzt wird. Seine Pharmakokinetik und Pharmakodynamik werden von einer Reihe physiologischer und genetischer Faktoren beeinflusst, die die therapeutische Wirksamkeit beeinträchtigen können. Diese Arbeit präsentiert ein physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell von Losartan und seinem aktiven Metaboliten E3174, um diese Einflüsse systematisch zu untersuchen. Das modulare, SBML-basierte Modell umfasst Teilmodelle für Absorption, hepatischen Metabolismus, renale Ausscheidung und pharmakodynamische Effekte über das Renin-Angiotensin-Aldosteron-System (RAAS). Simulationen wurden durchgeführt, um den Einfluss der Dosis, von hepatischer und renaler Beeinträchtigung sowie von CYP2C9- und ABCB1-Polymorphismen zu untersuchen. Das Modell reproduzierte erfolgreich beobachtete pharmakologische Trends, darunter einen dosisabhängigen Anstieg der pharmakodynamischen Reaktion, was vermutlich eine verstärkte Rezeptorblockade bei höherer systemischer Exposition widerspiegelt. Eine hepatische Funktionsstörung dämpfte die pharmakodynamische Reaktion auf Losartan, während eine renale Beeinträchtigung die Metabolitenclearance verringerte und zu einer moderaten Verstärkung des pharmakodynamischen Effekts führte. Genetische Variabilität in CYP2C9 veränderte die Bildung von E3174 und die nachgeschaltete RAAS-Hemmung deutlich, während die ABCB1-Aktivität nur geringe Effekte auf die systemische Exposition hatte. Das Modell liefert mechanistische Einblicke in die interindividuelle Variabilität der Losartan-Therapie und unterstützt dessen mögliche Anwendung in individualisierten Dosierungsstrategien.'
elisabetta_rivaroxaban_preprint:
  title:
    sha: 6ce666e2bc0e21e9
    text: 'Ein systempharmakologischer Ansatz für Rivaroxaban: Physiologiebasierte Modellierung von Pharmakokinetik und Gerinnungsdynamik'
  short:
    sha: 68f469a9d33e2ac4
    text: 'Unser neuester Preprint stellt ein umfassendes physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell von Rivaroxaban vor, das die Simulation von Absorption, Verteilung, Metabolismus, Ausscheidung und Gerinnungsdynamik des Arzneimittels unter verschiedenen klinischen Bedingungen ermöglicht.'
  abstract:
    sha: 99ef1765b78a5db4
    text: 'Rivaroxaban, ein weit verbreitetes direktes orales Antikoagulans (DOAC), zeigt eine erhebliche interindividuelle Variabilität in Pharmakokinetik und Pharmakodynamik, insbesondere bei Patientinnen und Patienten mit veränderter Physiologie oder Komorbiditäten. In dieser Studie haben wir eine offene Datenbank mit PK/PD-Daten aus 14 klinischen Studien aufgebaut und ein mechanistisches Ganzkörper-PBPK/PD-Modell entwickelt, um das Verhalten von Rivaroxaban unter verschiedenen Dosierungen, Nahrungsaufnahmebedingungen und Graden hepatischer und renaler Beeinträchtigung zu beschreiben. Das Modell reproduziert die beobachteten Plasmakonzentrations-Zeit-Profile und die Gerinnungsdynamik präzise, einschließlich der Faktor-Xa-Hemmung, der Prothrombinzeit (PT) und der aktivierten partiellen Thromboplastinzeit (aPTT). Durch die Erfassung zentraler Variabilitätsquellen bietet das Modell einen robusten Rahmen zur Untersuchung personalisierter Dosierungsstrategien, zur Verbesserung der klinischen Entscheidungsfindung und zur Integration in Plattformen für digitale Zwillinge und klinische Entscheidungsunterstützungssysteme.'
hip_day_2025:
  title:
    sha: 0e16a8d4e9cd70e5
    text: 'Humboldt Internship Program Day 2025: Projektbericht & Podiumsdiskussion'
  short:
    sha: 54213918d6565bfb
    text: 'Isabella Tan, Olivia Yau und Minjun Kim stellten am Program Day hier an der Humboldt-Universität zu Berlin ihre PBPK/PD-Modellierungsprojekte zu GLP-1-Agonisten vor.'
  abstract:
    sha: 5afee20b40b89873
    text: 'Am Program Day an der Humboldt-Universität zu Berlin stellten Isabella Tan, Olivia Yau und Minjun Kim ihre physiologiebasierten pharmakokinetischen/pharmakodynamischen (PBPK/PD) Modellierungsprojekte zu GLP-1-Rezeptoragonisten vor. Minjun Kim entwickelt ein Modell von Dulaglutid, um dessen Absorption, Verteilung, Metabolismus und Effekte auf die Glukoseregulation zu untersuchen. Isabella Tan baut ein Modell von Liraglutid auf, um dessen pharmakologisches Verhalten und den Einfluss auf die Glukosehomöostase zu untersuchen, mit Fokus auf individualisierte Behandlungsstrategien. Olivia Yau arbeitet an einem Modell von Lixisenatid, um dessen Kinetik und therapeutische Effekte zu erforschen, mit dem Ziel, personalisierte Ansätze für die Diabetestherapie voranzubringen. Zudem wirkte Matthias König als Diskussionsteilnehmer an der Podiumsdiskussion „Real Work Experiences for a Real Career: What Learnings and Skills Really Matter?“ mit.'
sirolimus_project:
  title:
    sha: 9dcb9957edb98235
    text: 'Neues PBPK/PD-Modellierungsprojekt: Rapamycin als Fallstudie für personalisierte immunsuppressive Therapie'
  short:
    sha: 757b3bb9db7e1ddc
    text: 'Monika Jesionek hat ein neues ERASMUS-Projekt gestartet, um ein physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell von Rapamycin zu entwickeln, mit dem Ziel, die interindividuelle Variabilität besser zu verstehen und die Entwicklung eines immune digital twin zu unterstützen.'
  abstract:
    sha: 9d4eeae287518116
    text: 'Im Rahmen ihres ERASMUS-Forschungsaufenthalts entwickelt Monika Jesionek ein Ganzkörper-PBPK/PD-Modell des mTOR-Hemmers Rapamycin (Sirolimus). Rapamycin spielt eine zentrale Rolle in der immunsuppressiven Therapie, doch seine klinische Anwendung wird durch eine enge therapeutische Breite, eine komplexe Pharmakokinetik und eine hohe interindividuelle Variabilität erschwert. Das Projekt verbindet Literaturdaten mit mechanistischer Modellierung, um Absorption, Verteilung, Metabolismus und immunmodulierende Effekte von Rapamycin unter verschiedenen physiologischen und pathologischen Bedingungen zu simulieren. Dieser digitale-Zwilling-Ansatz zielt darauf ab, Dosierungsstrategien zu optimieren und zu Bemühungen um personalisierte Medizin beizutragen, insbesondere im breiteren Kontext des Aufbaus eines immune digital twin (IDT).'
Elias2025_glimepiride_preprint:
  title:
    sha: 863b5c7dc407d78e
    text: 'Digitaler Zwilling von Glimepirid ermöglicht personalisierte Diabetestherapie'
  short:
    sha: 1d80b70a002a1d56
    text: 'Wir präsentieren einen digitalen pharmakokinetischen Zwilling von Glimepirid, der simuliert, wie patientenspezifische Faktoren das Arzneimittelverhalten beeinflussen, und damit eine individualisierte und stratifizierte Behandlung von Typ-2-Diabetes unterstützt.'
  abstract:
    sha: 1382864b7a86e06e
    text: 'In einem neuen Preprint stellen Michelle Elias und Matthias König ein physiologiebasiertes pharmakokinetisches (PBPK) Ganzkörpermodell von Glimepirid als digitalen Zwilling für die präzise Diabetesversorgung vor. Das anhand kuratierter Daten aus 19 klinischen Studien entwickelte Modell erfasst die ADME-Prozesse von Glimepirid und integriert quantitativ zentrale Quellen interindividueller Variabilität - darunter Leber- und Nierenfunktion, CYP2C9-Genotyp und Körpergewicht. Der digitale Zwilling bildet die beobachtete Pharmakokinetik präzise ab und zeigt, wie genetische und physiologische Faktoren die Arzneimittelexposition deutlich verändern können. Durch die Ermöglichung virtueller Patientensimulationen bietet dieses Modell eine mechanistische Plattform für personalisierte Dosierung und Patientenstratifizierung und treibt digitale Entscheidungsunterstützungswerkzeuge für eine wirksamere und individualisiertere Behandlung von Typ-2-Diabetes voran.'
bachelor_nike:
  title:
    sha: c469e3ddaacdd39e
    text: 'Bachelorarbeit Nike Nemitz: Physiologiebasierte pharmakokinetische/pharmakodynamische Modellierung von Dapagliflozin'
  short:
    sha: 055ce56c39e6542a
    text: 'In dieser Bachelorarbeit wurde ein PBPK/PD-Modell von Dapagliflozin entwickelt, um zu untersuchen, wie physiologische und externe Faktoren wie hepatorenale Beeinträchtigung und Nahrungsaufnahme das Arzneimittelverhalten und die therapeutische Wirksamkeit bei der Behandlung von Typ-2-Diabetes beeinflussen.'
  abstract:
    sha: 846176be0104ab79
    text: 'Dapagliflozin, ein SGLT2-Hemmer für Typ-2-Diabetes, senkt den Plasmaglukosespiegel durch eine verstärkte renale Glukoseausscheidung (UGE). Seine Pharmakokinetik und Pharmakodynamik unterliegen jedoch einer erheblichen interindividuellen Variabilität, die durch Dosierung, Organfunktion und Nahrungsaufnahme beeinflusst wird. Diese Studie präsentiert ein physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell, das mit SBML und Daten aus 27 klinischen Studien erstellt wurde und modulare Darstellungen der intestinalen Absorption, des hepatischen Metabolismus und der renalen Ausscheidung umfasst. Das Modell reproduziert zuverlässig die beobachteten dosisabhängigen PK/PD-Profile und simuliert die physiologische Variabilität sowie Nahrungseffekte. Simulationen zeigen, dass eine renale Beeinträchtigung die UGE deutlich verringert, während eine hepatische Beeinträchtigung nur einen geringen Einfluss hat. Nahrungsaufnahme senkt die maximalen Plasmakonzentrationen (Cmax) deutlich, ohne die AUC zu beeinflussen, was einen klinisch relevanten, oft übersehenen Effekt auf die Pharmakodynamik verdeutlicht. Diese Arbeit liefert mechanistische Einblicke in zentrale Determinanten der Dapagliflozin-Variabilität und unterstützt deren Nutzung für die prädiktive Modellierung einer individualisierten Therapie in der Diabetesversorgung.'
bua_panel_diversity:
  title:
    sha: 0c44e4334980f764
    text: 'Reflexionen zur Inklusion im Forschungsdesign'
  short:
    sha: e719f3e73e8b9e91
    text: 'Dr. Matthias König nahm an einer interdisziplinären Podiumsdiskussion des Berlin University Alliance Fellows Club teil, um zu erörtern, wie inklusives Design die Forschung über verschiedene Fachbereiche hinweg beeinflusst. Die Veranstaltung beleuchtete vielfältige Ansätze - von KI im Gesundheitswesen bis zum Quantencomputing - zur Förderung einer pluralistischen und gerechten Wissenschaft.'
  abstract:
    sha: eb98c3c9edd8bd51
    text: '„Methods of Inclusion: Designing Research for a Plural World“ - Teil der Reihe Berlin University Alliance Fellows Club trifft... das Einstein Center Population Diversity am 11. Juni. Gemeinsam mit einer inspirierenden Gruppe von Forschenden aus verschiedenen Fachbereichen - von der Soziologie bis zum Quantencomputing - haben wir untersucht, wie Inklusion, Repräsentation und Pluralität das Forschungsdesign über Disziplinen hinweg prägen. Ich hatte die Gelegenheit, Perspektiven aus unserer Arbeit zu KI-gestützter Gesundheitsversorgung und digitalen Zwillingen zu teilen und zu zeigen, wie inklusive Designprinzipien für den Aufbau fairer und transparenter Entscheidungsunterstützungswerkzeuge in der Medizin unverzichtbar sind. Ein großes Dankeschön an die Organisatorinnen und Organisatoren der Berlin University Alliance, des Einstein Center Population Diversity und der Stiftung Charité für die Schaffung eines Raums für institutionsübergreifenden Austausch und nachdenklichen Dialog. #Diversity #DigitalTwins #InclusiveResearch #BerlinUniversityAlliance #PopulationDiversity #SystemsMedicine #OpenScience. Danke an Camilla Leathem, PhD, Sarah Bellows-Blakely, Michaela Kreyenfeld, Günter M. Ziegler, Lara Bister, Cole Kovarik und Fariha Azad'
mb19_ss2025:
  title:
    sha: c1b4159c56ab3017
    text: 'Kurs abgeschlossen: Pharmakokinetische/pharmakodynamische Modellierung'
  short:
    sha: c567e90ad1cffaf3
    text: 'Vom 3. bis 6. Juni haben wir unseren neu konzipierten Kurs zur pharmakokinetischen/pharmakodynamischen (PK/PD) Modellierung erfolgreich durchgeführt. Entwickelt im Rahmen des Digital Health Profession Educator (DHPE) Programms, legte der Kurs den Schwerpunkt auf Interaktivität und praxisnahes Lernen im Kontext der klinischen Pharmakologie.'
  abstract:
    sha: a5cfaa84d30a967a
    text: 'Der Kurs zur pharmakokinetischen/pharmakodynamischen (PK/PD) Modellierung wurde im Rahmen eines Lehrinnovationsprojekts innerhalb des Digital Health Profession Educator (DHPE) Programms vollständig für mehr Interaktivität umgestaltet. Der Kurs bot eine umfassende Einführung, wie Arzneimittel im Körper absorbiert, verteilt, metabolisiert und ausgeschieden werden - und wie diese Prozesse die Arzneimittelwirkung beeinflussen. Die Studierenden befassten sich sowohl mit klassischen Kompartimentmodellen als auch mit physiologiebasierten pharmakokinetischen (PBPK) Modellen und lernten, wie sich Arzneimittelverhalten simulieren und Dosierungsstrategien optimieren lassen. Das neu gestaltete Format integrierte aktive Lernkomponenten, praktische Modellierungsübungen und Fallstudien aus der Praxis, um das Verständnis zu vertiefen. Zu den Themen zählten außerdem Pharmakodynamik, Arzneimittelinteraktionen sowie die Anwendung von Modellen in der Arzneimittelentwicklung und personalisierten Therapie. Der Kurs verband erfolgreich konzeptionelles Wissen mit angewandten Fertigkeiten und bereitete die Teilnehmenden darauf vor, PK/PD-Modelle als Werkzeuge für translationale und klinische Forschung einzusetzen.'
spp_startup_funding:
  title:
    sha: 76a663d9552d87fc
    text: 'SPP-Startfinanzierung für webbasiertes FEM-Visualisierungstool bewilligt'
  short:
    sha: 70f8840dca4be1ac
    text: 'Matthias König erhielt eine Startfinanzierung in Höhe von 15.000 € aus dem DFG-Schwerpunktprogramm SPP2311 zur Entwicklung von SPP-FEMVis, einer webbasierten Visualisierungsplattform für Finite-Elemente-Methode-(FEM)-Simulationen zur Unterstützung von Open Science und interdisziplinärer Zusammenarbeit.'
  abstract:
    sha: 5cfee1a6e7f3ef15
    text: 'Wir freuen uns bekannt zu geben, dass Matthias König eine Startfinanzierung aus dem DFG-Schwerpunktprogramm SPP2311 – Robust Coupling of Continuum Biomechanical In Silico Models to Biomedical Data erhalten hat. Sein Projekt, SPP-FEMVis: Advancing Open Science with Web-Based FEM Visualizations, zielt darauf ab, mit PyVista und Trame ein interaktives, browserbasiertes Visualisierungstool für FEM-Simulationsergebnisse zu schaffen. Mit einer Förderung von 15.000 € unterstützt das Projekt die Entwicklung eines flexiblen Visualisierungsframeworks, das in Websites und Jupyter Notebooks integriert wird und den nahtlosen Austausch und die Erkundung von Simulationsdaten ermöglicht. Das Tool wird die Zugänglichkeit und Reproduzierbarkeit computergestützter Ergebnisse in biomedizinischen Anwendungen verbessern, darunter Lebermodellierung, Herzmechanik und Gefäßsimulationen. Durch den Abbau technischer Hürden und die Förderung der gemeinsamen Nutzung von FEM-Modellen wird SPP-FEMVis die Open-Science-Mission von SPP2311 stärken und als Brücke zur Wissensvermittlung zwischen Forschenden, Klinikerinnen und Klinikern sowie der Öffentlichkeit dienen.'
algonomy_pisa:
  title:
    sha: 443187923b90a0cc
    text: 'Algonomy beim Festival della Robotica 2025: KI und digitale Zwillinge für die Leberchirurgie'
  short:
    sha: 2f7694f7c6dd75d7
    text: 'Beim Festival della Robotica 2025 in Pisa stellte Mariia Myshkina unsere Forschung aus dem Algonomy-Projekt vor und zeigte, wie KI und digitale Zwillinge die Entscheidungsfindung in der hepatobiliären Chirurgie unterstützen können.'
  abstract:
    sha: 036ec8129d5398ea
    text: 'Das Algonomy-Projekt, das die ethische und praktische Integration von KI in die klinische Entscheidungsfindung untersucht, war beim Festival della Robotica 2025 in Pisa vertreten. Stellvertretend für das Team präsentierte Mariia Myshkina unsere neueste Forschung zu digitalen Zwillingen in der hepatobiliären Chirurgie - und zeigte, wie KI-gestützte Rechenmodelle der Leberanatomie und -funktion die chirurgische Planung und individualisierte Behandlungsstrategien verbessern können. Unser Beitrag unterstrich die zentrale Mission von Algonomy: algorithmische Intelligenz mit klinischer Expertise zu verbinden und dabei Transparenz, Reproduzierbarkeit und gemeinsame Entscheidungsfindung in der Medizin zu gewährleisten.'
hip2025:
  title:
    sha: 1fac594323a43fae
    text: 'Neue Projekte gestartet: Modellierung von GLP-1-Agonisten und Optimierung der Anästhesiesteuerung'
  short:
    sha: ca6fdc563f755cf9
    text: 'Wir freuen uns, neue Forschungsprojekte in unserer Gruppe bekannt zu geben, die sich auf personalisierte Behandlungsstrategien für Diabetes und ein verbessertes Anästhesiemanagement durch Rechenmodelle und Regelungssysteme konzentrieren.'
  abstract:
    sha: 03543f73850c0f1a
    text: 'Kim, Isabella und Olivia haben neue Projekte gestartet, in denen sie physiologiebasierte pharmakokinetische/pharmakodynamische (PBPK/PD) Modelle der GLP-1-Rezeptoragonisten Dulaglutid, Liraglutid beziehungsweise Lixisenatid entwickeln. Ihre Arbeit zielt darauf ab, unser Verständnis des Verhaltens dieser Arzneimittel und ihrer Effekte auf die Glukoseregulation zu vertiefen und damit zu individualisierteren Ansätzen der Diabetesbehandlung beizutragen. Parallel dazu arbeitet Juan Pablo an einem Closed-Loop-Regelungssystem zur Optimierung der Anästhesiezufuhr, mit dem Ziel, Präzision und Patientensicherheit in klinischen Umgebungen zu verbessern.'
interview2025_reproducibility:
  title:
    sha: 567b6c061bda3a93
    text: 'Interview: Matthias König über Reproduzierbarkeit, Open Science und die Zukunft der biologischen Forschung'
  short:
    sha: 55ec974c211f607c
    text: 'In einem Interview für die Berlin University Alliance spricht Matthias König über die Reproduzierbarkeitskrise in der Biologie und das transformative Potenzial von Open Science. Als BUA Open Science Ambassador betont er die Bedeutung von FAIR-Daten, offenen Standards und eines kulturellen Wandels in der Wissenschaft.'
  abstract:
    sha: 218f9145d8e29822
    text: 'Am 30. April 2025 wurde Matthias König, BUA Open Science Ambassador, zur Rolle von Open Science bei der Verbesserung von Reproduzierbarkeit und Zusammenarbeit in der biologischen Forschung interviewt. Ausgehend von seiner Arbeit zu Rechenmodellen und digitalen Zwillingen erläutert König, wie offene Daten, FAIR-Prinzipien und transparenter Code für reproduzierbare Wissenschaft unerlässlich sind. Er verweist auf systemische Hürden - etwa Anreizstrukturen, die sich ausschließlich auf Publikationen konzentrieren - und fordert alternative Bewertungskriterien, die Open-Science-Engagement anerkennen. Zudem betont er die Bedeutung gemeinschaftsgetragener Initiativen, institutioneller Unterstützung und Bildung für den Aufbau einer offeneren und kollaborativeren Forschungskultur. Das Interview unterstreicht die entscheidende Rolle von Open Science für eine verantwortungsvolle KI-Entwicklung und den langfristigen Fortschritt in den Lebenswissenschaften.'
bachelor_michelle:
  title:
    sha: a03a4a49150c66c4
    text: 'Bachelorarbeit Michelle Elias: PBPK-Modellierung von Glimepirid: Untersuchung der Variabilität in der Typ-2-Diabetes-Behandlung'
  short:
    sha: 2a03a221085dda76
    text: 'Michelle Elias hat ihre Bachelorarbeit zu einem physiologiebasierten pharmakokinetischen (PBPK) Modell von Glimepirid erfolgreich abgeschlossen, mit Fokus auf interindividuelle Variabilität, hepatorenale Beeinträchtigung und Pharmakogenomik.'
  abstract:
    sha: 621072a114e565c8
    text: 'Glimepirid, ein weit verbreitetes Sulfonylharnstoff-Präparat für Typ-2-Diabetes, zeigt eine erhebliche interindividuelle Variabilität in der Pharmakokinetik, bedingt durch Faktoren wie Organfunktion und genetische Polymorphismen. In ihrer Arbeit entwickelte Michelle Elias ein modulares, SBML-basiertes PBPK-Modell anhand von Daten aus 19 klinischen Studien, um die Absorption von Glimepirid, den hepatischen CYP2C9-vermittelten Metabolismus und die renale Ausscheidung zu simulieren. Das Modell reproduzierte die dosisabhängige Pharmakokinetik präzise und zeigte die unterschiedlichen Auswirkungen von renaler und hepatischer Beeinträchtigung sowie den Einfluss von CYP2C9-Genotypen und Körpergewicht auf. Trotz eingeschränkter Datenlage bei stark beeinträchtigten Populationen liefert das Modell mechanistische Einblicke in die Variabilität und unterstützt individualisierte Dosierungsstrategien für eine verbesserte Diabetesversorgung.'
sbml_editor:
  title:
    sha: daec0875216521b5
    text: 'SBML-Editor'
  short:
    sha: 1838626bf1da6076
    text: 'Matthias König wurde für die Amtszeit 2025–2027 zum SBML-Editor gewählt.'
  abstract:
    sha: 309ab7b406390a84
    text: 'Es ist mir eine Ehre, gemeinsam mit Brett Olivier für die Amtszeit 2025–2027 zum SBML-Editor gewählt worden zu sein. Ich bin dankbar für das Vertrauen der Community und freue mich darauf, zur Zukunft von SBML beizutragen. Ein großes Dankeschön an die scheidenden Editoren Sarah Keating und Rahuman Sheriff für ihre engagierte Arbeit! #SBML #SystemsBiology #ComputationalModeling #OpenScience'
bua_alumni:
  title:
    sha: c28d80e67cd8716d
    text: 'Featured Fellow - Berlin University Alliance (BUA) - Matthias König'
  short:
    sha: 94b27dd8a7a30de5
    text: 'Als Featured BUA Fellow an der Humboldt-Universität treibt Matthias König die digitale Medizin und Systembiologie an der Schnittstelle von Daten, Modellierung und klinischer Forschung voran.'
  abstract:
    sha: 9e317af109baf22d
    text: 'Lernen Sie Matthias König kennen, BUA Fellow und Systembiologe an der Humboldt-Universität zu Berlin. Er entwickelt Rechenmodelle - sogenannte digitale Zwillinge -, die den menschlichen Stoffwechsel und die Organfunktion simulieren, um die personalisierte Medizin voranzubringen. Mit einem Hintergrund in Physik und Systemmedizin leitet Matthias Forschung, die mathematische Modellierung, Bioinformatik und klinische Daten integriert, um die Leber- und Nierenfunktion besser zu verstehen. Seine Arbeit trägt zu nationalen und europäischen Bemühungen bei, datengetriebene, prädiktive Werkzeuge für das Gesundheitswesen zu entwickeln. Auf die Frage nach der Berliner Forschungslandschaft sagt er: „Berlin bietet eine einzigartige Mischung aus wissenschaftlicher Freiheit und Zusammenarbeit. Es ist ein spannender Ort für interdisziplinäre Forschung, die wirklich etwas bewirkt.“'
fair_to_cure:
  title:
    sha: d57ced6370fcd7b7
    text: 'Preprint: From FAIR to CURE: Guidelines for Computational Models of Biological Systems'
  short:
    sha: 6424ec7683c02a7d
    text: 'Unser neuester Preprint, From FAIR to CURE: Guidelines for Computational Models of Biological Systems, stellt die CURE-Prinzipien - Credible, Understandable, Reproducible und Extensible - als Rahmenwerk zur Verbesserung von Entwicklung und Nutzung computergestützter Modelle in Biologie und Medizin vor.'
  abstract:
    sha: df8bb8761334cf6d
    text: 'Leitlinien für den Umgang mit wissenschaftlichen Daten wurden mit den FAIR-Prinzipien etabliert, die verlangen, dass Daten Findable, Accessible, Interoperable und Reusable (auffindbar, zugänglich, interoperabel und wiederverwendbar) sind. In vielen wissenschaftlichen Disziplinen, insbesondere der computergestützten Biologie, sind sowohl Daten als auch Modelle entscheidend für den Fortschritt. Aus diesem Grund, und in der Erkenntnis, dass solche Modelle eine ganz besondere Art von ''Daten'' sind, argumentieren wir, dass computergestützte Modelle - insbesondere die in Medizin, Physiologie und Systembiologie verbreiteten mechanistischen Modelle - ein ergänzendes Regelwerk verdienen. Wir schlagen die CURE-Prinzipien vor, die betonen, dass Modelle Credible, Understandable, Reproducible und Extensible (glaubwürdig, verständlich, reproduzierbar und erweiterbar) sein sollten. Wir gehen auf jedes Prinzip im Detail ein und behandeln Verifikation, Validierung und Unsicherheitsquantifizierung für die Glaubwürdigkeit von Modellen; die Klarheit von Modellbeschreibungen und Annotationen für Verständlichkeit; die Einhaltung von Standards und Open-Science-Praktiken für Reproduzierbarkeit; sowie die Nutzung offener Standards und modularen Codes für Erweiterbarkeit und Wiederverwendung. Wir skizzieren empfohlene Anforderungen und Mindestanforderungen für jeden Aspekt von CURE mit dem Ziel, die Wirkung und Vertrauenswürdigkeit computergestützter Modelle zu erhöhen, insbesondere in biomedizinischen Anwendungen, in denen Glaubwürdigkeit von zentraler Bedeutung ist. Unsere Perspektive unterstreicht die Notwendigkeit eines disziplinierteren Ansatzes für die Modellierung, im Einklang mit aufkommenden Trends wie digitalen Zwillingen, und betont die Bedeutung von Daten- und Modellierungsstandards für Interoperabilität und Wiederverwendung. Schließlich betonen wir, dass angesichts des nicht unerheblichen Aufwands zur Umsetzung der Leitlinien die Community bestrebt ist, so viele der Leitlinien wie möglich zu automatisieren.'
ep_conference_2025:
  title:
    sha: 98fd476123e34d0e
    text: 'König Lab bei der EP PerMed Conference on Personalised Medicine Research'
  short:
    sha: ea31607b3a2b7970
    text: 'Wir freuen uns, bekannt zu geben, dass Mariia Myshkina, Elisabetta Casabianca und Matthias König an der EP PerMed Conference on Personalised Medicine Research teilnahmen, die vom 11. bis 12. Februar 2025 in Berlin stattfand.'
  abstract:
    sha: 37627c733e5d37fb
    text: 'Wir freuen uns, bekannt zu geben, dass Mariia Myshkina, Elisabetta Casabianca und Matthias König an der EP PerMed Conference on Personalised Medicine Research teilnahmen, die vom 11. bis 12. Februar 2025 in Berlin stattfand. Diese Konferenz beleuchtet zentrale Fortschritte in der personalisierten Medizin, mit Schwerpunkt auf Methodik, translationaler Forschung, personalisierter Prävention und Inklusion im Gesundheitswesen. Die Diskussionen umfassen Diagnostik, Therapie, Big Data, klinische Studien, Ethik und mehr. Die Veranstaltung bietet eine einzigartige Gelegenheit für multidisziplinäre Zusammenarbeit, um das Feld voranzubringen und die Zukunft der personalisierten Medizin zu gestalten. Wir freuen uns auf anregende Diskussionen, Networking und einen Beitrag zu dieser wichtigen Initiative! Weitere Details finden Sie auf der Website von EP PerMed: https://www.eppermed.eu/news-events/events/ep-permed-conference-on-personalised-medicine-research/'
project_rivaroxaban:
  title:
    sha: 81cfcddc0dc6c2b0
    text: 'Start eines neuen Forschungspraktikums in der PBPK/PD-Modellierung'
  short:
    sha: c050c668001108f2
    text: 'PBPK/PD-Modellentwicklung für das direkte orale Antikoagulans Rivaroxaban'
  abstract:
    sha: 30d204edae8b6e7f
    text: 'Wir freuen uns, bekannt zu geben, dass Elisabetta Cassabianca dem König Lab beitreten wird, um an einem spannenden neuen Projekt zur Entwicklung eines physiologiebasierten pharmakokinetischen/pharmakodynamischen (PBPK/PD) Modells des direkten oralen Antikoagulans (DOAC) Rivaroxaban zu arbeiten. Seit ihrer Einführung haben DOACs die Antikoagulanzientherapie revolutioniert und bieten gegenüber der traditionellen Vitamin-K-Antagonisten-Therapie erhebliche Vorteile, etwa weniger diätetische Einschränkungen und seltenere Kontrollen. Trotz ihrer weiten Verbreitung bestehen jedoch weiterhin Lücken im Verständnis ihrer Langzeitwirksamkeit, Sicherheit und Auswirkungen auf bestimmte Patientengruppen. Elisabettas Projekt zielt darauf ab, diese Wissenslücken durch die Entwicklung eines umfassenden PBPK/PD-Modells von Rivaroxaban zu schließen. Dieses Rechenmodell dient als digitaler Zwilling des menschlichen Körpers und ermöglicht präzise Vorhersagen der Pharmakokinetik (Absorption, Verteilung, Metabolismus und Ausscheidung) und Pharmakodynamik (antikoagulatorische Effekte) des Arzneimittels. Das Modell wird maßgeblich dazu beitragen, den Einfluss verschiedener Faktoren wie Alter, Geschlecht, hepatischer oder renaler Beeinträchtigung und genetischer Variationen auf die Rivaroxaban-Therapie zu untersuchen.'
projects_abhinav:
  title:
    sha: 81cfcddc0dc6c2b0
    text: 'Start eines neuen Forschungspraktikums in der PBPK/PD-Modellierung'
  short:
    sha: 45334f2d0a09042e
    text: 'PBPK-Modellentwicklung für Tirzepatid in der Diabetes- und Adipositasbehandlung'
  abstract:
    sha: 3a0fb241895569fa
    text: 'Abhinav Mishra, Masterpraktikant, wird ein physiologiebasiertes pharmakokinetisches (PBPK) Modell für Tirzepatid (Mounjaro, Zepbound) entwickeln, einen dualen Agonisten der GLP-1- und GIP-Rezeptoren, der zur Behandlung von Typ-2-Diabetes mellitus (T2DM) und Adipositas eingesetzt wird. Das Projekt konzentriert sich auf die Analyse der Pharmakokinetik (PK) und Pharmakodynamik (PD) des Arzneimittels, mit besonderem Augenmerk auf die Effekte renaler und hepatischer Beeinträchtigungen. Durch den Aufbau eines Rechenmodells und die Integration patientenspezifischer Daten zielt die Forschung darauf ab, die Faktoren, die individuelle Reaktionen beeinflussen, besser zu verstehen und den klinischen Einsatz von Tirzepatid in verschiedenen Patientengruppen zu verbessern.'
algonomy:
  title:
    sha: de87b540fbd48a2a
    text: 'Circle U. finanziert AlgoNomy zur Bekämpfung von digitalem Paternalismus in der KI-gestützten Gesundheitsversorgung'
  short:
    sha: ff150f8eb316b95b
    text: 'Circle U. hat AlgoNomy: Advancing Doctor-Patient Autonomy in AI-Driven Healthcare finanziert, ein gemeinschaftliches Projekt, das sich mit digitalem Paternalismus befasst - bei dem Algorithmen Entscheidungen im Gesundheitswesen dominieren, anstatt menschliche Zusammenarbeit zu ermöglichen. In Partnerschaft mit sechs führenden europäischen Universitäten zielt AlgoNomy darauf ab, ethische, transparente und patientenzentrierte KI-Systeme zu entwickeln, die Autonomie bewahren und gemeinsame Entscheidungsfindung fördern.'
  abstract:
    sha: 850211e9676d4c70
    text: 'Die Circle U. European University Alliance hat eine Förderung für AlgoNomy: Advancing Doctor-Patient Autonomy in AI-Driven Healthcare bekanntgegeben, ein wegweisendes Projekt zur Bekämpfung des aufkommenden Problems des digitalen Paternalismus - einer Weiterentwicklung des medizinischen Paternalismus, bei dem Entscheidungen im Gesundheitswesen zunehmend von Algorithmen statt vom gemeinsamen Beitrag von Patientinnen, Patienten und Ärztinnen und Ärzten bestimmt werden. Unter der Leitung eines Konsortiums aus sechs führenden Universitäten - UniPi (Universität Pisa), KCL (King''s College London), PC (Université Paris Cité), BU (Universität Belgrad), UW (Universität Wien) und HU (Humboldt-Universität zu Berlin) - konzentriert sich AlgoNomy auf die Entwicklung ethischer, technischer und praktischer Lösungen, die sicherstellen, dass KI die menschliche Autonomie in der klinischen Entscheidungsfindung stärkt, statt sie zu ersetzen. Gefördert im Rahmen der Circle U.-Initiative widmet sich AlgoNomy der Förderung transparenter, patientenzentrierter und klinikerfreundlicher KI-Systeme, die gemeinsame Entscheidungsfindung und verantwortungsvolle Innovation im Gesundheitswesen unterstützen. Dieses ambitionierte Projekt markiert einen bedeutenden Schritt zur Neudefinition der Rolle von KI in der Medizin und stellt sicher, dass Technologie als Werkzeug für Zusammenarbeit dient, nicht für Kontrolle. Bleiben Sie gespannt auf weitere Updates dazu, wie AlgoNomy die Zukunft ethischer KI im Gesundheitswesen gestaltet!'
huinternship2025:
  title:
    sha: a0f388f68af2e9cb
    text: 'Humboldt Internship Program 2025 - Computergestützte Modellierung der Arzneimittelentgiftung - Ein systemmedizinischer Ansatz'
  short:
    sha: a87b942ee3fe3e0b
    text: 'Wir bieten Praktika im Jahr 2025 an, dreimonatige akademische Forschungsaufenthalte an der Humboldt-Universität zu Berlin. Die Bewerbung für die Summer Term Internships 2025 ist vom 11. November bis 20. Dezember 2024 möglich.'
  abstract:
    sha: 75f4b7275f383e3c
    text: 'Das Humboldt Internship Program ist ein internationales Kurzzeitprogramm für fachspezifisches, erfahrungsbasiertes Lernen. Es ermöglicht Teilnehmenden, drei Monate lang in Teams an Forschungsprojekten und universitätsnahen Start-ups mitzuarbeiten.<br /><br /> Das Programm richtet sich an fortgeschrittene Bachelor- und Masterstudierende sowie Promovierende. Wählen Sie aus Projekten in verschiedenen akademischen Bereichen, erhalten Sie individuelle Beratung und erwerben Sie ECTS-Leistungspunkte. Einige Projekte bieten auch Online-Praktika an. Details entnehmen Sie bitte den einzelnen Projektbeschreibungen.<br /><br /> Die dreimonatigen Summer Term Internships finden zwischen Mai und August 2025 statt. Weitere Informationen unter <a href="https://hic.hu-berlin.de/en/internship-program">https://hic.hu-berlin.de/en/internship-program</a>.'
projects_ennie_michelle:
  title:
    sha: 29b0f9ed2a442888
    text: 'Start von zwei neuen Forschungsprojekten in der PBPK/PD-Modellierung'
  short:
    sha: 65f36a4275ead8cd
    text: 'Ennie Tensil und Michelle Elias starten Bachelorprojekte zu Losartan und Glimepirid'
  abstract:
    sha: 7bd2fa03f9d11a4b
    text: 'Wir freuen uns, den Start zweier Projekte in unserer Gruppe bekannt zu geben, die sich auf die Entwicklung physiologiebasierter pharmakokinetischer/pharmakodynamischer (PBPK/PD) Modelle konzentrieren. Diese Projekte zielen darauf ab, unser Verständnis der Arzneimittelwirkung und der Variabilität in den Behandlungsreaktionen zu vertiefen und damit einen wichtigen Beitrag zur personalisierten Medizin zu leisten. Michelle Elias leitet das erste Projekt, das sich auf die Entwicklung eines PBPK/PD-Modells für das Sulfonylharnstoff-Präparat Glimepirid konzentriert, ein weitverbreitetes Medikament zur Behandlung von Typ-2-Diabetes. Dieses Projekt zielt darauf ab, unser Verständnis der bei der Diabetesbehandlung mit Sulfonylharnstoffen beobachteten intraindividuellen Variabilität zu verbessern, mit besonderem Fokus auf Unterschiede in der hepatorenalen Funktion. Die aus diesem Modell gewonnenen Erkenntnisse könnten zu individuelleren und wirksameren Behandlungsstrategien für Patientinnen und Patienten mit Diabetes führen. Das zweite Projekt, geleitet von Ennie Tensil, konzentriert sich auf die Entwicklung eines PBPK/PD-Modells für den Angiotensin-II-Rezeptorblocker (ARB) Losartan. Dieses Medikament wird häufig zur Behandlung von Bluthochdruck und zum Schutz vor Schlaganfall bei Hochrisikopatientinnen und -patienten verschrieben. Das Projekt untersucht die physiologischen Faktoren, die die Pharmakokinetik und Pharmakodynamik von Losartan beeinflussen, mit dem Ziel, unser Verständnis seiner Wirksamkeit und Variabilität in verschiedenen Patientengruppen zu verbessern. Beide Projekte stellen wichtige Fortschritte in unseren Forschungskapazitäten dar, mit dem Potenzial, die klinische Praxis durch tiefere Einblicke in Arzneimittelverhalten und Patientenvariabilität zu beeinflussen. Wir freuen uns auf die Ergebnisse dieser Studien und ihren Beitrag zum Fachgebiet der Pharmakologie.'
master_thesis_jonas.kuettner:
  title:
    sha: 3ca90b6a54bd45f2
    text: 'Masterarbeit Jonas Küttner'
  short:
    sha: afd13e5cc7a5cda4
    text: 'Jonas Küttner reichte seine Masterarbeit ein, in der er einen Workflow für die Bildanalyse in der Leber entwickelte'
  abstract:
    sha: 10405f6fd3d563e6
    text: 'Die Leber von Säugetieren ist in dreidimensionale Strukturen, sogenannte Läppchen (Lobuli), gegliedert, die für ihre Funktion von zentraler Bedeutung sind. Nach dem weithin akzeptierten hexagonalen Modell ist der Querschnitt jedes Läppchens durch eine Zentralvene und portale Triaden an den Ecken gekennzeichnet. Diese portalen Triaden bestehen aus einer Pfortader, einer Leberarteriole und einem Gallengang. Blut wird über die Leberarterie und die Pfortader zugeführt und fließt von der äußeren periportalen Region nach innen zur Zentralvene durch Sinusoide, die von Hepatozyten ausgekleidet sind. Diese Hepatozyten exprimieren eine Vielzahl von Stoffwechselenzymen, darunter Cytochrom-P450-(CYP)-Isoformen, die für den Fremdstoffwechsel entscheidend sind. Bemerkenswert ist, dass viele Leberenzyme, einschließlich der CYPs, entlang der Achse von periportal zu perivenös eine unterschiedliche Expression zeigen, eine räumliche Variation, die als Leberzonierung bezeichnet wird. Die nichtalkoholische Fettlebererkrankung (NAFLD) ist eine der häufigsten Lebererkrankungen und ist durch die Ansammlung von Fett in der Leber (Steatose) ohne signifikanten Alkoholkonsum gekennzeichnet. Histopathologisch ist NAFLD durch das Vorhandensein mikrovesikulärer Fetttropfen in Hepatozyten gekennzeichnet. Obwohl die Leberzonierung umfassend untersucht wurde, wurden die Proteingradienten der CYPs und ihre Veränderungen infolge von Steatose bislang nicht systematisch quantifiziert oder artübergreifend verglichen. Ziel dieser Studie war die Entwicklung eines Bildanalyse-Workflows, um diese läppchenbezogenen Expressionsgradienten präzise zu erfassen und Makrosteatose in Ganzschnittbildern (WSI) der Leberhistologie zu quantifizieren. Es wurde eine umfassende Analyse von Ganzschnittbildern (WSIs) von Maus-, Ratten-, Schweine- und humanen Leberproben durchgeführt. Diese Bilder umfassten Hämatoxylin-Eosin-(H&E)-gefärbte Schnitte sowie immunhistochemisch gefärbte Schnitte für Glutaminsynthetase (GS) und die Cytochrom-P450-Isoformen 1A2, 2E1, 2D6 und 3A4. Zur Erreichung der Studienziele wurden zwei Bildanalyse-Workflows entwickelt: einer mit klassischen Methoden und einer mit Convolutional Neural Networks (CNN). Diese Workflows wurden entwickelt, um zwei zentrale Aufgaben zu erfüllen: (1) die Segmentierung von Leberläppchen und (2) die Erkennung von Makrosteatose-Tropfen. Zentrale Befunde waren eine erhebliche Variabilität der Läppchengeometrie innerhalb der Individuen bei starker Konsistenz zwischen den Spezies, wobei Unterschiede zwischen den Spezies vor allem in der Läppchengröße beobachtet wurden. In steatotischen Proben wurde ein leichter Anstieg der Läppchengröße beobachtet, mit einer moderaten bis starken Korrelation zwischen Läppchengröße und Steatosegehalt. Zudem wurden artübergreifende Unterschiede in den Zonierungsmustern für CYP1A2 bei Schweinen, CYP2E1 bei Ratten und CYP3A4 beim Menschen beobachtet. Bemerkenswert ist, dass sich die Zonierungsmuster bei steatotischen Individuen qualitativ nicht von denen bei nicht-steatotischen Individuen über die Spezies hinweg unterschieden. Zusammenfassend habe ich erfolgreich einen Bildanalyse-Workflow für Ganzschnittbilder (WSIs) entwickelt und implementiert, der eine detaillierte Untersuchung der Läppchengeometrie und der Makrosteatose-Tropfen ermöglicht. Darüber hinaus wurden die resultierenden Datensätze integriert, um eine umfassende Analyse der zonalen Verteilung der CYP-Proteinexpression und der Makrosteatose innerhalb der Läppchen zu ermöglichen.'
bua_open_science_ambassador:
  title:
    sha: 471c3d848cdf232b
    text: 'Open Science Ambassador der BUA'
  short:
    sha: b929132496cb5158
    text: 'Stolz darauf, 2024 als Open Science Ambassador der Berlin University Alliance (BUA) ausgewählt worden zu sein.'
  abstract:
    sha: 1c7e47a075253d77
    text: 'Um disziplinspezifische und zugängliche Lösungen zu finden, die in den Forschungsalltag integriert werden können, haben wir uns als Open Science Ambassador beworben. Im Rahmen dieser Arbeit werden wir uns mit der Reproduzierbarkeit computergestützter Modelle befassen.'
dhpe:
  title:
    sha: 1753b778440f7fd3
    text: 'Teilnahme am DHPE'
  short:
    sha: 3122db28788ff9bd
    text: 'Matthias König für das Digital Health Professions Educator (DHPE) Program ausgewählt'
  abstract:
    sha: 085ce2afddc6e52c
    text: 'Wir freuen uns, bekannt zu geben, dass Matthias König für die Teilnahme am „Digital Health Professions Educator“ (DHPE) Programm für 2024/25 ausgewählt wurde. Dieses Programm, Teil des Projekts „HEDS: Handlungs- und Entscheidungskompetenz Digital Stärken“, zielt darauf ab, die digitalen Lehrkompetenzen an der Charité zu stärken. Es läuft von Juni 2024 bis Juni 2025 und umfasst monatliche Präsenztermine sowie digitale Selbstlerneinheiten, die zu einer bundesweit anerkannten Zertifizierung (MQ II) führen.<br/ > Wir freuen uns darauf, diesen Weg zu beschreiten, um unsere Expertise in der digitalen Gesundheitsbildung weiter auszubauen!'
hip2024_day:
  title:
    sha: 2d3d4b2b69c75e25
    text: 'Humboldt Internship Program (HIP) Konferenz'
  short:
    sha: db00bef2171717f5
    text: 'Stolz auf die Teilnahme am Humboldt Internship Program 2024. Großartige Arbeit von Vera, Deepa und Prerna.'
  abstract:
    sha: 86ff4597749bbc44
    text: 'Studierende präsentierten ihre Ergebnisse im Rahmen des Humboldt Internship Program 2024. Großartige Arbeit von Vera, Deepa und Prerna.'
edith_amsterdam:
  title:
    sha: 7c6d4a3145bad25f
    text: 'Abschließendes Ecosystem Meeting von EDITH zum Aufbau des VHT'
  short:
    sha: 41b851cebb73ce1d
    text: 'Stolz auf die Teilnahme am abschließenden Ecosystem Meeting von EDITH zum Aufbau des Virtual Human Twin (VHT) in Amsterdam.'
  abstract:
    sha: 7ff8f7d851908592
    text: 'Der erste Tag war einer Plenarsitzung zur EDITH-Proof-of-Concept-Infrastruktur gewidmet, vorgestellt aus der Perspektive der Nutzenden, bei der Forschende, Communities sowie Gesundheitsdienstleister und Patientinnen und Patienten gut vertreten waren, um Ressourcen zu verknüpfen und die föderierte Natur des VHT zu beleuchten, sowie um den VHT direkt am Krankenbett in klinische Workflows einzubinden und Patientinnen und Patienten das Hochladen ihrer eigenen Daten in den VHT zu ermöglichen, während Vertreterinnen und Vertreter der Industrie mögliche Interaktionen von Diensten innerhalb des VHT untersuchten.'
vera_project:
  title:
    sha: ff9f269b64f5a354
    text: 'Neues Projekt: Vera Tereshchuk startet SGLT2-PBPK-Modellierungsprojekt'
  short:
    sha: f71b9d5bf453ee91
    text: 'Vera Tereshchuk wird ein PBPK-Modell für Canagliflozin entwickeln, um das Verständnis von Pharmakokinetik und Pharmakodynamik bei Diabetes zu verbessern.'
  abstract:
    sha: f1e97dcc62229c47
    text: 'Vera Tereshchuk entwickelt ein physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell des SGLT2-Hemmers Canagliflozin. Ziel ist es, das Verständnis der intraindividuellen Variabilität in der Diabetesbehandlung mit SGLT2-Hemmern zu verbessern, mit Fokus auf Unterschiede in der hepatorenalen Funktion.'
page2024:
  title:
    sha: 86b49614f702bbc3
    text: 'PAGE2024: Präsentation unserer Forschung in Rom'
  short:
    sha: 26344b4380883c87
    text: 'Mariia Myshkina und Matthias König präsentierten unsere Modellierungsergebnisse zu Captopril beim PAGE2024-Treffen (Population Approach Group Europe) in Rom.'
  abstract:
    sha: 3902f13614414cbc
    text: 'Einleitung: ACE-Hemmer (Angiotensin-converting-Enzym-Hemmer) wie Captopril werden häufig zur Behandlung von Hypertonie und Herzinsuffizienz verschrieben. Captopril, der erste in den 1980er Jahren entwickelte ACE-Hemmer, wird überwiegend oral eingenommen und rasch resorbiert, wobei die maximalen Plasmakonzentrationen innerhalb einer Stunde erreicht werden. Seine Halbwertszeit beträgt etwa 2 Stunden, doch mehrere Faktoren, darunter Nierenfunktion, Herzerkrankungen, Alter und Geschlecht, können seine Pharmakokinetik beeinflussen. Trotz der weiten Verbreitung von Captopril fehlten bislang umfassende pharmakokinetische Daten. Unsere Gruppe hat PK-DB (https://pk-db.com) [1] entwickelt, eine offene Datenbank mit hochwertigen pharmakokinetischen Daten aus klinischer und präklinischer Forschung. PK-DB umfasst Kohortenmerkmale von Patientinnen und Patienten, Interventionen, Konzentrations-Zeit-Profile und kinetische Parameter, mit der Möglichkeit, pharmakokinetische Parameter automatisch mittels nicht-kompartimenteller Methoden zu berechnen. Ziele: Ziel dieser Studie war es, pharmakokinetische Daten zu Captopril zu kuratieren und zu analysieren, die PK-DB zu erweitern, ein Ganzkörper-physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell von Captopril gemäß den FAIR-Prinzipien [2] zu entwickeln und das Verständnis der intraindividuellen Variabilität der Captopril-Pharmakokinetik zu verbessern, die durch Faktoren wie Alter, Geschlecht, Nieren- und Herzfunktion beeinflusst wird. Methoden: Über 600 Publikationen zur Pharmakokinetik von Captopril wurden im Rahmen einer systematischen Literaturrecherche gesichtet, wobei eine Teilmenge für die Datenkuratierung in PK-DB ausgewählt wurde. Das PBPK-Modell wurde mit einem kompartimentellen Ansatz entwickelt und zur Zugänglichkeit und Reproduzierbarkeit in der Systems Biology Markup Language (SBML) [3] kodiert. Ergebnisse: Ein umfassender Datensatz zur Pharmakokinetik von Captopril wurde aus 15 klinischen Studien an gesunden Freiwilligen sowie Patientinnen und Patienten mit Niereninsuffizienz, Herzinsuffizienz und Hypertonie erstellt. Das PBPK-Modell umfasst vier Hauptkompartimente (Blut, Darm, Leber, Niere) und beschreibt Absorption, Verteilung, Metabolismus und Ausscheidung. Es bildet das pharmakokinetische Profil von Captopril in verschiedenen Altersgruppen erfolgreich ab und zeigt dabei nur minimale altersbedingte Unterschiede in der unveränderten Wirkstoffkonzentration. Herzinsuffizienz hatte keinen signifikanten Einfluss auf die maximale Plasmakonzentration oder die Fläche unter der Kurve (AUC), doch die Nierenfunktion beeinflusste die Elimination von Captopril stark. Wir präsentieren diesen Datensatz sowie das offene PBPK-Modell von Captopril als wertvolle Ressource für die weitere Forschung. Schlussfolgerungen: Diese Studie etabliert erfolgreich einen frei zugänglichen, umfassenden Datensatz sowie ein offenes PBPK-Modell von Captopril und verbessert damit unser Verständnis seines pharmakokinetischen Verhaltens in verschiedenen Patientengruppen. Unsere Ergebnisse unterstreichen die Bedeutung der Nierenfunktion für die Elimination von Captopril und liefern eine wertvolle Ressource für personalisierte Medizinansätze in der Behandlung von Hypertonie und Herzinsuffizienz.'
bachelor_thesis_afruja.hossain:
  title:
    sha: fde815a9e218f231
    text: 'Bachelorarbeit Afruja Hossain'
  short:
    sha: a9731764246c0efa
    text: 'Afruja Hossain schloss ihre Bachelorarbeit zur Entwicklung einer Datenbank von CYP- und UGT-Enzymen ab'
  abstract:
    sha: 7f1ce13c32717dd8
    text: 'Afruja Hossain hat ihre Bachelorarbeit mit dem Titel „A Systematic Overview of Protein Variability in Cytochrome P450 and UDP-glucuronosyltransferase Enzymes in the Human Liver“ erfolgreich abgeschlossen. Ihre Forschung bietet eine eingehende Analyse der zentralen Leberenzyme Cytochrom P450 (CYP450) und UDP-Glucuronosyltransferase (UGT), die für den Arzneimittelstoffwechsel entscheidend sind. Die Studie beleuchtet die Variabilität der Proteinspiegel dieser Enzyme, die durch Faktoren wie Alter, Rauchen und Alkoholkonsum beeinflusst wird. Zentrale Ergebnisse sind: - Erstellung einer Datenbank der CYP- und UGT-Proteinspiegel in der menschlichen Leber. - Identifikation einer erheblichen individuellen Variabilität der Enzymproteinspiegel. - Korrelationen zwischen verschiedenen CYP- und UGT-Isoformen. Afrujas Arbeit liefert wertvolle Einblicke in den Arzneimittelstoffwechsel und könnte das Verständnis von Arzneimittelinteraktionen und Toxizität verbessern. Herzlichen Glückwunsch an Afruja zu dieser bedeutenden akademischen Leistung.'
pkcourse_SS2024:
  title:
    sha: 38f377fc7ed4ec2c
    text: 'Erfolgreicher Abschluss des einwöchigen Kurses zur pharmakokinetischen Modellierung'
  short:
    sha: cda581a23303cb99
    text: 'Wir freuen uns, den erfolgreichen Abschluss unseres einwöchigen Intensivkurses zur pharmakokinetischen Modellierung bekannt zu geben, in dem sich Studierende mit Grundprinzipien, Arzneimittelverteilung, Clearance, Elimination und verschiedenen Modellierungstechniken zur Verbesserung von Arzneimitteltherapie und -entwicklung befassten.'
  abstract:
    sha: 3c0355963a10a9b0
    text: 'Pharmakokinetische Modellierung ist die Untersuchung, wie Arzneimittel im Körper absorbiert, verteilt, metabolisiert und ausgeschieden werden. Der Kurs zur pharmakokinetischen Modellierung behandelt Themen wie pharmakokinetische Grundprinzipien, Arzneimittelverteilung, Clearance und Elimination sowie die Faktoren, die diese Prozesse beeinflussen. Die Studierenden lernen verschiedene Modelle zur Beschreibung der Pharmakokinetik kennen, etwa Kompartimentmodelle und physiologiebasierte pharmakokinetische Modelle, sowie deren Einsatz zur Vorhersage von Arzneimittelkonzentrationen und zur Optimierung von Dosierungsschemata. Weitere mögliche Themen sind Pharmakodynamik, Arzneimittelinteraktionen und der Einsatz pharmakokinetischer Modellierung in Arzneimittelentwicklung und klinischer Praxis. Insgesamt vermittelt ein Kurs zur pharmakokinetischen Modellierung den Studierenden ein umfassendes Verständnis der Prinzipien und Techniken zur Beschreibung der Bewegung von Arzneimitteln durch den Körper sowie deren Anwendung zur Verbesserung der Arzneimitteltherapie.'
prerna_pk_llm:
  title:
    sha: 1a2096021cc3d22c
    text: 'Start eines neuen Projekts über das Humboldt Internship Program (HIP): PK-LLM von Prerna Parakkat'
  short:
    sha: 8f1fbd62e6b4bbb4
    text: 'Wir freuen uns, den Start eines neuen Projekts von Prerna Parakkat im Rahmen des Humboldt Internship Program (HIP) bekannt zu geben. Prerna wird an PK-LLM: Implementing a Large Language Model (LLM) as an Expert System for Pharmacokinetic (PK) Data Curation from Scientific Publications arbeiten.'
  abstract:
    sha: 9dcaac4295ec9094
    text: 'Das Projekt konzentriert sich auf die Entwicklung eines spezialisierten LLM, das darauf zugeschnitten ist, pharmakokinetische Daten aus verschiedenen wissenschaftlichen Texten zu interpretieren und zu extrahieren, und automatisiert dabei die Extraktion zentraler Daten wie Parameter, Dosierungsinformationen und Angaben zu den Studienteilnehmenden. Zudem soll dieses System mit bestehenden pharmakokinetischen Datenbanken und Rechenmodellierungs-Workflows für digitale Zwillinge integriert werden. Wir erwarten deutliche Verbesserungen in der Genauigkeit und Effizienz der pharmakokinetischen Datenextraktion und -kuratierung, die einen neuen Standard auf diesem Gebiet setzen.'
species_comparison_publication:
  title:
    sha: aa5ff9cb18059879
    text: 'Publikation: Cross-Species Variability in Lobular Geometry and Cytochrome P450 Hepatic Zonation: Insights into CYP1A2, CYP2E1, CYP2D6 and CYP3A4'
  short:
    sha: a3e868b67f037ebe
    text: 'Unsere neueste Publikation zu „Cross-Species Variability in Lobular Geometry & Cytochrome P450 Hepatic Zonation“ liefert Einblicke in die Leberfunktion über verschiedene Spezies hinweg mittels WSI-Technologie.'
  abstract:
    sha: 300e22e7e68a6fc5
    text: 'Diese Studie untersucht das entscheidende Zusammenspiel zwischen der Läppchengeometrie und der zonierten Verteilung von Cytochrom-P450-(CYP)-Enzymen über verschiedene Spezies hinweg. Wir präsentieren einen innovativen Ansatz zur Erfassung von Läppchengeometrie und Zonierungsmustern mittels Ganzschnittbildgebung (WSI). Diese Methode ermöglicht einen detaillierten, systematischen Vergleich der Läppchenstrukturen und der räumlichen Verteilung zentraler CYP450-Enzyme und der Glutaminsynthetase in vier verschiedenen Spezies (Maus, Ratte, Schwein und Mensch). Unsere Ergebnisse beleuchten Speziesunterschiede in Läppchengeometrie und enzymatischer Zonierung und liefern damit wichtige Einblicke für die Arzneimittelstoffwechselforschung. Basierend auf unserem Ansatz konnten wir die minimale Anzahl an Läppchen bestimmen, die für eine statistisch repräsentative Analyse erforderlich ist - eine wichtige Information bei der Auswertung von Leberbiopsien und der Ableitung von Informationen aus WSI.'
nike_yusuf_projects:
  title:
    sha: 32f2daea512f7da4
    text: 'Neue Projekte: Nike Nemitz und Yusuf Ali Kulanoglu starten PBPK-Modellierungsprojekte'
  short:
    sha: 2c95fc800e144cfc
    text: 'Nike Nemitz und Yusuf Ali Kulanoglu werden PBPK-Modelle für Dapagliflozin beziehungsweise Aliskiren entwickeln, mit dem Ziel, das Verständnis von Pharmakokinetik und Pharmakodynamik in der Diabetes- und Herz-Kreislauf-Behandlung zu verbessern.'
  abstract:
    sha: a3804be6d6ada8ad
    text: 'Nike Nemitz entwickelt ein physiologiebasiertes pharmakokinetisches/pharmakodynamisches (PBPK/PD) Modell des SGLT2-Hemmers Dapagliflozin. Ziel ist es, das Verständnis der intraindividuellen Variabilität in der Diabetesbehandlung mit SGLT2-Hemmern zu verbessern, mit Fokus auf Unterschiede in der hepatorenalen Funktion. Yusuf Ali Kulanoglu arbeitet an einem PBPK-Modell des direkten Renin-Hemmers Aliskiren, um das Verständnis seiner Pharmakokinetik und der beeinflussenden Faktoren zu verbessern. Beide Projekte zielen darauf ab, tiefere Einblicke in Arzneimittelverhalten und -variabilität zu liefern und so möglicherweise die therapeutischen Ergebnisse zu verbessern.'
sedml_l1v5_publication:
  title:
    sha: fb154ffcb771937a
    text: 'Publikation: The Simulation Experiment Description Markup Language (SED-ML): Language Specification for Level 1 Version 5'
  short:
    sha: 63679c3a68b9ab87
    text: 'Level 1 Version 5 von SED-ML verbessert die Möglichkeit, computergestützte Simulationsexperimente zu annotieren, zu archivieren, zu teilen und zu reproduzieren, indem es Modelliererinnen und Modellierern erlaubt, Tasks, Modelländerungen, Wertebereiche und Outputs mithilfe der Kinetic Simulation Algorithm Ontology (KiSAO) zu definieren.'
  abstract:
    sha: 3d80479aa0e372a2
    text: 'Wir freuen uns, die neueste Publikation mit dem Titel „The Simulation Experiment Description Markup Language (SED-ML): Language Specification for Level 1 Version 5“ bekannt zu geben. Diese Publikation adressiert den wachsenden Bedarf der modernen biologischen Forschung an Methoden zum Annotieren, Archivieren, Teilen und Reproduzieren computergestützter Simulationsexperimente. Da computergestützte Simulationen für die biologische Forschung zunehmend zentral werden, ist eine umfassende Zusammenarbeit zwischen Modelliererinnen und Modellierern, Experimentalforschenden und Ingenieurinnen und Ingenieuren erforderlich. Die Minimum-Information-About-a-Simulation-Experiment-(MIASE)-Richtlinien bieten einen Rahmen für das Teilen solcher Experimente, und SED-ML stellt ein maschinenlesbares Format für die in MIASE beschriebenen Informationen bereit. Level 1 Version 5 von SED-ML erweitert die Möglichkeiten für Modelliererinnen und Modellierer erheblich, indem es die Definition von Tasks, Modelländerungen, Wertebereichen und Outputs mithilfe der Kinetic Simulation Algorithm Ontology (KiSAO) erlaubt. Dies baut auf Version 4 auf, die es erlaubte, Simulationen vollständig mit KiSAO zu definieren. Das wachsende Ökosystem von SED-ML umfasst eine breite Vielfalt an Forschenden, Modellierungssprachen und Softwarewerkzeugen und unterstützt verschiedene Simulationswerkzeuge, visuelle Editoren, Modell-Repositorien und Validatoren. Weitere Informationen zu SED-ML und seinen Anwendungen finden Sie unter https://sed-ml.org.'
master_thesis_shubhankar.palwankar:
  title:
    sha: f5842649a83222f6
    text: 'Masterarbeit Shubhankar Palwankar'
  short:
    sha: 2085267e5f49af19
    text: 'Shubhankar Palwankar verteidigte seine Masterarbeit zur Entwicklung eines PBPK-Modells von Enalapril'
  abstract:
    sha: 63e0f588b4d085f7
    text: 'Wir freuen uns, bekannt zu geben, dass Shubhankar Palwankar seine Masterarbeit erfolgreich verteidigt hat, die sich auf die Entwicklung eines physiologiebasierten pharmakokinetischen (PBPK) Modells von Enalapril konzentriert, einem wichtigen Medikament zur Behandlung von Bluthochdruck und anderen Herz-Kreislauf-Erkrankungen. Enalapril wirkt als ACE-Hemmer und spielt eine zentrale Rolle bei der Regulierung des Blutdrucks über das Renin-Angiotensin-Aldosteron-System (RAAS). Shubhankars Forschung umfasste den Aufbau einer umfangreichen Datenbank aus 49 klinischen Studien, die zur Parametrisierung und Validierung seines Rechenmodells genutzt wurde. Sein Modell simuliert die Pharmakokinetik von Enalapril und seinem aktiven Metaboliten Enalaprilat unter verschiedenen Bedingungen, einschließlich renaler und hepatischer Beeinträchtigung sowie Veränderungen der CES1-Enzymaktivität, effektiv. Die Ergebnisse dieser Studie liefern wertvolle Einblicke, wie verschiedene physiologische Beeinträchtigungen das Verhalten des Arzneimittels im Körper beeinflussen, und zeigen eine hervorragende Übereinstimmung mit klinischen Daten. Das entwickelte Modell und die Daten sind im SBML-Format unter einer CC-BY-4.0-Lizenz über die PK-DB-Pharmakokinetik-Datenbank öffentlich zugänglich und leisten damit einen Beitrag zu Open Science und zur weiteren Forschung in der Pharmakokinetik. Herzlichen Glückwunsch an Shubhankar Palwankar zu seinen bedeutenden Beiträgen zur pharmakologischen Forschung und zu seiner erfolgreichen Verteidigung.'
spt_preprint:
  title:
    sha: 4173dcb514f94389
    text: 'Neues multiskaliges Lebermodell enthüllt Zonierungs-Funktions-Dynamiken bei arzneimittelinduzierter Leberschädigung (DILI).'
  short:
    sha: c69e995210fe9978
    text: 'Wir freuen uns, den Preprint unserer neuesten Forschungsarbeit bekannt zu geben, „Simulation of zonation-function relationships in the liver using coupled multiscale models: Application to drug-induced liver injury“. Diese Studie stellt einen multiskaligen digitalen Zwilling der Leber vor, der Modelle von der zellulären bis zur läppchenweiten Skala integriert, und beleuchtet, wie Zonierungsmuster der Leber die arzneimittelinduzierte Leberschädigung beeinflussen.'
  abstract:
    sha: 7561c7e6f0ba7e5b
    text: 'Multiskalige Modellierung erfordert die Kopplung von Modellen auf unterschiedlichen Skalen, die häufig auf verschiedenen mathematischen Ansätzen basieren und von unterschiedlichen Forschungsteams entwickelt werden. Dies bringt zahlreiche Herausforderungen mit sich, etwa die Definition von Schnittstellen für die Kopplung, den reproduzierbaren Austausch von Teilmodellen, die effiziente Simulation der Modelle oder die Reproduzierbarkeit der Ergebnisse. Hier präsentieren wir einen multiskaligen digitalen Zwilling der Leber, der einen auf partiellen Differentialgleichungen (PDE) basierenden Porous-Media-Ansatz für das Leberläppchen mit zellskaligen, auf gewöhnlichen Differentialgleichungen (ODE) basierenden Modellen koppelt. Die auf der Theorie poröser Medien basierenden Modelle beschreiben Transport, mechanische Gewebeeigenschaften und Deformationen auf Läppchenebene, während die zellulären Modelle den hepatischen Metabolismus im Sinne des Arzneimittelstoffwechsels und die Schädigung im Sinne der Nekrose beschreiben. Das resultierende multiskalige Lebermodell wurde genutzt, um Perfusions-Zonierungs-Funktions-Beziehungen in der Leber über Skalen von der Einzelzelle bis zum Läppchen zu simulieren. Das Modell wurde angewendet, um die Effekte von (i) Proteinzonierungsmustern (metabolische Zonierung) und (ii) der Konzentrationsabhängigkeit des Arzneimittels auf räumlich heterogene Leberschädigung in Form von Nekrose zu untersuchen. Je nach Zonierungsmuster konnten unterschiedliche Muster der Leberschädigung reproduziert werden, darunter periportale und perizentrale Nekrose, wie sie bei arzneimittelinduzierter Leberschädigung (DILI) auftritt. Eine Erhöhung der Arzneimittelkonzentration führte zu einer Zunahme des beobachteten Schädigungsmusters. Ein zentraler Erfolgsfaktor war die Integration domänenspezifischer Simulatoren auf Basis standardisierter Austauschformate, das heißt libroadrunner für die Hochleistungssimulation ODE-basierter Systeme und FEBio für die Simulation des kontinuumsbiomechanischen Teils. Dies ermöglicht einen standardisierten und reproduzierbaren Austausch zellskaliger Modelle in der Systems Biology Markup Language (SBML) zwischen Forschungsgruppen.'
morphine_project:
  title:
    sha: fc7aaa19e61ac308
    text: 'PBPK-Modell von Morphin - Projekt'
  short:
    sha: 24e7302c28cbb7b2
    text: 'Start eines neuen Praktikumsprojekts: Entwicklung eines physiologiebasierten pharmakokinetischen Modells von Morphin. Deepa wird, unterstützt von Rohini und Rohit, ein PBPK-Modell von Morphin entwickeln.'
  abstract:
    sha: f2d3a9be6626f9a1
    text: 'Deepa wird, unterstützt von Rohini und Rohit, ein physiologiebasiertes pharmakokinetisches (PBPK) Modell von Morphin entwickeln. Morphin, ein potentes Analgetikum aus dem Schlafmohn, ist für die Schmerzbehandlung unverzichtbar, birgt jedoch erhebliche pharmakokinetische Herausforderungen. Dieses Projekt zielt darauf ab, die intraindividuelle Variabilität in der Morphinbehandlung zu adressieren, indem eine umfassende Pharmakokinetik-/Pharmakodynamik-Datenbank aufgebaut und ein Ganzkörper-Rechenmodell erstellt wird. Zentrale Schwerpunkte sind die Rolle von Leber und Niere beim Metabolismus und der Ausscheidung von Morphin, die Effekte renaler und hepatischer Beeinträchtigung sowie die Effekte unterschiedlicher Morphin-Formulierungen und Verabreichungswege. Diese Forschung zielt darauf ab, den sicheren und wirksamen Einsatz von Morphin in klinischen Umgebungen zu verbessern, unter Berücksichtigung von Faktoren wie Alter und genetischen Polymorphismen.'
myshkina_atlas:
  title:
    sha: 92b481d801ed602d
    text: 'Mariia Myshkina hat ihre Promotion im ATLAS-Projekt begonnen.'
  short:
    sha: b0462f4dba59ea66
    text: 'Wir begrüßen Mariia in unserem Team, die im Rahmen von ATLAS an der computergestützten Modellierung der Leber arbeiten wird.'
  abstract:
    sha: ac39e158bebb76e9
    text: 'Mariia wird PBPK-Modelle der Leber bei HCC entwickeln, gekoppelt mit Ansätzen des maschinellen Lernens.'
edith_paris:
  title:
    sha: d665ba7b63d5a256
    text: 'Teilnahme am ersten EDITH-CSA Ecosystem Meeting - Advancing the Virtual Human Twin'
  short:
    sha: 7959e44062196702
    text: 'Wir nahmen am ersten EDITH-CSA ''Ecosystem meeting on building the Virtual Human Twin'' teil, das am 18. und 19. Januar 2024 an der École Polytechnique in Paris stattfand.'
  abstract:
    sha: 31404980bee6d140
    text: 'Nach dem offiziellen Start der Virtual-Human-Twin-Initiative und des VHT-Manifests im Dezember zog das erste offene Community-Treffen über 180 registrierte Gäste aus dem EDITH-CSA-Konsortium und dem weiteren Ökosystem an. Die Begeisterung der weiteren Community, trotz schwieriger Wetterbedingungen nach Paris zu reisen und proaktiv an der Entwicklung der Roadmap für den VHT mitzuwirken, war inspirierend.'
species_comparison_preprint:
  title:
    sha: 87202d639f1525df
    text: 'Preprint: Cross-Species Variability in Lobular Geometry and Cytochrome P450 Hepatic Zonation: Insights into CYP1A2, CYP2E1, CYP2D6 and CYP3A4'
  short:
    sha: ad37a0f78735f9a9
    text: 'Unser neuester Preprint zu „Cross-Species Variability in Lobular Geometry & Cytochrome P450 Hepatic Zonation“ liefert Einblicke in die Leberfunktion über verschiedene Spezies hinweg mittels WSI-Technologie.'
  abstract:
    sha: 300e22e7e68a6fc5
    text: 'Diese Studie untersucht das entscheidende Zusammenspiel zwischen der Läppchengeometrie und der zonierten Verteilung von Cytochrom-P450-(CYP)-Enzymen über verschiedene Spezies hinweg. Wir präsentieren einen innovativen Ansatz zur Erfassung von Läppchengeometrie und Zonierungsmustern mittels Ganzschnittbildgebung (WSI). Diese Methode ermöglicht einen detaillierten, systematischen Vergleich der Läppchenstrukturen und der räumlichen Verteilung zentraler CYP450-Enzyme und der Glutaminsynthetase in vier verschiedenen Spezies (Maus, Ratte, Schwein und Mensch). Unsere Ergebnisse beleuchten Speziesunterschiede in Läppchengeometrie und enzymatischer Zonierung und liefern damit wichtige Einblicke für die Arzneimittelstoffwechselforschung. Basierend auf unserem Ansatz konnten wir die minimale Anzahl an Läppchen bestimmen, die für eine statistisch repräsentative Analyse erforderlich ist - eine wichtige Information bei der Auswertung von Leberbiopsien und der Ableitung von Informationen aus WSI.'
Kohrs2023_elife:
  title:
    sha: 159adb433e25882b
    text: 'Eleven Strategies for Making Reproducible Research and Open Science Training the Norm at Research Institutions'
  short:
    sha: b1f239bec5b9f18d
    text: 'Wir freuen uns, unsere neueste Publikation in eLife bekannt zu geben, die einen Fahrplan für die Integration von reproduzierbarer Forschung und Open-Science-Praktiken in die akademische Arbeit bietet.'
  abstract:
    sha: 4f9ea0be0c6694f8
    text: 'Wir freuen uns, bekannt zu geben, dass unsere aktuelle Publikation „Eleven Strategies for Making Reproducible Research and Open Science Training the Norm at Research Institutions“ in eLife veröffentlicht wurde und einen Fahrplan für die Integration von reproduzierbarer Forschung und Open-Science-Praktiken in die akademische Arbeit bietet. In Zusammenarbeit mit dem German Reproducibility Network entwickelt, schlägt die Publikation elf Strategien vor, die sich auf die Anpassung von Bewertungskriterien für Forschung, die Verbesserung von Schulungen und die Förderung gemeinschaftlicher Unterstützung konzentrieren. Diese Arbeit zielt darauf ab, Forschende und Institutionen zu ermutigen, Praktiken zu übernehmen, die die Verlässlichkeit und Zugänglichkeit wissenschaftlicher Forschung erhöhen.'
dietary_twin:
  title:
    sha: 4c5dfeffba5497f1
    text: 'Your Dietary Digital Twin (DDtwin)'
  short:
    sha: 446f52f08905cde2
    text: 'Fortschritte in der Präzisionsernährung: Erfolgreicher Workshop zum Dietary Digital Twin, einem Workshop in Leiden vom 30. Oktober bis 3. November 2023.'
  abstract:
    sha: db707b37bd8e7357
    text: 'Wir freuen uns, unsere Teilnahme an einem bahnbrechenden Workshop bekannt zu geben, der der Entwicklung der Technologieplattform Dietary Digital Twin (DDtwin) gewidmet ist. Dieses innovative Vorhaben zielt darauf ab, Präzisionsernährung zu ermöglichen, indem biologiebasierte und datengetriebene Modelle mit Echtzeitdaten integriert werden, unterstützt durch tragbare Sensoren und Anwendungen.<br /><br /> Der Workshop brachte Expertinnen und Experten sowie Enthusiastinnen und Enthusiasten aus verschiedenen Fachbereichen zusammen, um die komplexe Aufgabe der Erweiterung von Modellen des Ganzkörper-Glukosestoffwechsels anzugehen. Der Schwerpunkt lag auf zwei technischen Herausforderungen: der Integration von Echtzeit-Daten aus der kontinuierlichen Glukosemessung (Continuous Glucose Monitoring, CGM) tragbarer Sensoren sowie der Gestaltung einer nutzerzentrierten Oberfläche, die den DDtwin mit über Apps erfassten Ernährungsdaten verbindet.<br /><br /> Die gemeinsamen Anstrengungen brachten bedeutende Fortschritte dabei, den DDtwin in die Lage zu versetzen, personalisierte Ernährungserkenntnisse und -empfehlungen zu liefern. Darüber hinaus diente der Workshop als Plattform zur Diskussion der ethischen, rechtlichen und sozialen Implikationen (ELSI) des Einsatzes solch fortschrittlicher Technologie im Alltag.<br /><br /> Unsere Teilnahme an diesem Workshop unterstreicht unser Engagement für die Weiterentwicklung von Gesundheitstechnologie und für eine Zukunft, in der Ernährung so individuell ist wie der Mensch selbst. Bleiben Sie gespannt auf weitere Entwicklungen, während wir das spannende Feld digitaler Zwillinge und der Präzisionsernährung weiter erkunden. Weitere Informationen finden Sie unter <a href="https://www.lorentzcenter.nl/your-dietary-digital-twin-ddtwin.html">https://www.lorentzcenter.nl/your-dietary-digital-twin-ddtwin.html</a>.'
huinternship2024:
  title:
    sha: 671fcd96d1adc906
    text: 'Humboldt Internship Program 2024 - Computergestützte Modellierung der Arzneimittelentgiftung - Ein systemmedizinischer Ansatz'
  short:
    sha: db74cc16fb15dce5
    text: 'Wir bieten Praktika im Jahr 2024 an, dreimonatige akademische Forschungsaufenthalte an der Humboldt-Universität zu Berlin. Die Bewerbung für die Summer Term Internships 2024 ist vom 3. November bis 10. Dezember 2023 möglich.'
  abstract:
    sha: 24aee091e259ac8b
    text: 'Das Humboldt Internship Program ist ein internationales Kurzzeitprogramm für fachspezifisches, erfahrungsbasiertes Lernen. Es ermöglicht Teilnehmenden, drei Monate lang in Teams an Forschungsprojekten und universitätsnahen Start-ups mitzuarbeiten.<br /><br /> Das Programm richtet sich an fortgeschrittene Bachelor- und Masterstudierende sowie Promovierende. Wählen Sie aus Projekten in verschiedenen akademischen Bereichen, erhalten Sie individuelle Beratung und erwerben Sie ECTS-Leistungspunkte. Einige Projekte bieten auch Online-Praktika an. Details entnehmen Sie bitte den einzelnen Projektbeschreibungen.<br /><br /> Die Summer Term Internships finden von Mai bis August 2023 statt. Weitere Informationen unter <a href="https://hic.hu-berlin.de/en/internship-program">https://hic.hu-berlin.de/en/internship-program</a>.'
emed_presentation:
  title:
    sha: beedb3f8a285e82c
    text: 'e:Med Meeting 2023 on Systems Medicine: Quantifying Fat Zonation in Liver Lobules: An Integrated Multiscale In-silico Model'
  short:
    sha: 4374b771d3e2e5da
    text: 'Wir präsentierten erfolgreich unsere Forschung zu reproduzierbaren digitalen Zwillingen für die personalisierte Leberfunktionsbewertung beim e:Med Meeting 2023 on Systems Medicine.'
  abstract:
    sha: 35696d65dec7cff7
    text: 'Wesentliche Voraussetzungen für die praktische Anwendung und Übertragung computergestützter Modelle sind: i) Reproduzierbarkeit der Ergebnisse; ii) Wiederverwendbarkeit und Erweiterbarkeit der Modelle; iii) Verfügbarkeit der Daten; und iv) Strategien zur Modellstratifizierung und -individualisierung. Hier präsentieren wir einen Modellierungs-Workflow, der um diese grundlegenden Voraussetzungen herum aufgebaut ist, mit Fokus auf Leberfunktionstests.<br /><br /> Trotz der überragenden Bedeutung der Leberfunktionsbewertung in der Hepatologie bleibt eine zuverlässige Quantifizierung eine klinische Herausforderung. Dynamische Leberfunktionstests bieten eine vielversprechende Methode zur nicht-invasiven In-vivo-Bewertung von Leberfunktion und metabolischer Phänotypisierung.<br /><br /> Durch den Einsatz von physiologiebasierten Ganzkörper-Pharmakokinetik-(PBPK)-Modellen simulieren wir diese Tests und positionieren PBPK-Modelle als digitale Zwillinge für metabolische Phänotypisierung und Leberfunktionsbewertung. Um unsere Modelle zu entwickeln und zu validieren, haben wir die offene Pharmakokinetik-Datenbank PK-DB aufgebaut, die kuratierte Daten aus über 600 klinischen Studien enthält. Unsere Modelle sind individualisierbar und stratifizierbar und ermöglichen die Simulation von Lebensstilfaktoren und Effekten gleichzeitiger Arzneimittelgabe auf den Arzneimittelstoffwechsel. Unsere Modelle waren in klinischen Szenarien von entscheidender Bedeutung: von der Vorhersage individueller Ergebnisse nach Hepatektomie bis zur Erfassung des Einflusses von CYP2D6-Genvarianten auf Leberfunktionstests. Diese Modelle sind hierarchisch aufgebaut und beschreiben metabolische und andere biologische Prozesse in Organen wie Leber und Niere, nahtlos integriert mit der Ganzkörperphysiologie.<br /><br /> Bemerkenswerterweise sind alle Modelle und Daten frei verfügbar und für die Wiederverwendung reproduzierbar, kodiert in der Systems Biology Markup Language (SBML). Wir geben einen Überblick über diese PBPK-Modelle und zeigen, wie SBML und die FAIR-Prinzipien Modellentwicklung, -kopplung und -wiederverwendung erleichtern können.'
fat_zonation_preprint:
  title:
    sha: 4426ca7dcad5ddf3
    text: 'Preprint: Quantifying Fat Zonation in Liver Lobules: An Integrated Multiscale In-silico Model'
  short:
    sha: f37439169c955d1e
    text: 'Unser neuester Preprint ist jetzt verfügbar: Ein integriertes multiskaliges Modell zur Quantifizierung der Fettzonierung in Leberläppchen.'
  abstract:
    sha: cb1a309177400f04
    text: 'Wir haben ein hochentwickeltes Computermodell entwickelt, um zu untersuchen, wie verschiedene Faktoren zur Verteilung und Ansammlung von Fett in der Leber beitragen, ein Phänomen, das als „metabolische Zonierung“ bekannt ist. Dieses Modell hilft dabei zu verstehen, wie die Lebergesundheit durch unterschiedliche Bedingungen beeinflusst wird, und könnte eine entscheidende Rolle bei der Erforschung von Erkrankungen wie MASLD (metabolic dysfunction-associated steatotic liver disease) spielen. Durch die Simulation von Leberfunktionen berücksichtigt das Modell Wechselwirkungen zwischen Blutfluss, Sauerstoffgehalt und Fettstoffwechsel innerhalb der Leberläppchen.'
brown_university_hannah:
  title:
    sha: 9ff5814ce4c492d9
    text: 'Hannah Menghis von der Brown University beginnt ihr Praktikum'
  short:
    sha: 80ffd95ae3c2e2be
    text: 'Wir begrüßen Hannah Menghis, die ein PBPK-Modell von Semaglutid erstellen wird.'
  abstract:
    sha: d3ff1b8e4df3dab7
    text: 'Hannah wird einen pharmakokinetischen Datensatz von Semaglutid erstellen und eine erste Version eines physiologiebasierten pharmakokinetischen (PBPK) Modells des GLP-1-Hemmers Semaglutid entwickeln. Ziel ist es, unser Verständnis der zugrunde liegenden Ursachen der intraindividuellen Variabilität in der Semaglutid-Behandlung zu verbessern, zum Beispiel Unterschiede in der Nierenfunktion.'
pancreas_publication:
  title:
    sha: 63c20fe132cdeb8f
    text: 'A pathway model of glucose-stimulated insulin secretion in the pancreatic β-cell'
  short:
    sha: 2804955c00d6cede
    text: 'Unsere neueste Publikation ist jetzt in Frontiers of Endocrinology erschienen: A pathway model of glucose-stimulated insulin secretion in the pancreatic β-cell'
  abstract:
    sha: ae1e17126681a959
    text: 'Die Bauchspeicheldrüse spielt eine entscheidende Rolle bei der Aufrechterhaltung der Glukosehomöostase durch die Sekretion von Hormonen aus den Langerhans-Inseln. Die glukosestimulierte Insulinsekretion (GSIS) durch die pankreatische β-Zelle ist der wichtigste Mechanismus zur Senkung erhöhter Plasmaglukosewerte. Hier präsentieren wir einen systematischen Modellierungs-Workflow zur Entwicklung kinetischer Pathway-Modelle mittels der Systems Biology Markup Language (SBML). Die Schritte umfassen die Beschaffung von Informationen aus Datenbanken, die Kuratierung experimenteller und klinischer Daten für Modellkalibrierung und -validierung, die Integration heterogener Daten einschließlich absoluter und relativer Messungen, Einheitennormalisierung, Datennormalisierung und Modellannotation. Ein wichtiger Faktor war die Reproduzierbarkeit und Austauschbarkeit des Modells, die den Einsatz verschiedener bestehender Werkzeuge ermöglichte. Der Workflow wurde angewendet, um ein neuartiges, datengetriebenes kinetisches Modell der GSIS in der pankreatischen β-Zelle zu erstellen, basierend auf experimentellen und klinischen Daten aus 39 Studien, die 50 Jahre Forschung zu Bauchspeicheldrüse, Inseln und β-Zellen bei Menschen, Ratten, Mäusen und Zelllinien umfassen. Das Modell besteht aus einer detaillierten Glykolyse sowie phänomenologischen Gleichungen für die Insulinsekretion, gekoppelt an den zellulären Energiezustand, die ATP-Dynamik und das ATP/ADP-Verhältnis. Zentrale Ergebnisse unserer Arbeit sind, dass bei der GSIS ein glukoseabhängiger Anstieg nahezu aller Zwischenprodukte der Glykolyse zu beobachten ist. Dieser Anstieg glykolytischer Metabolite geht mit einem Anstieg der Energiemetabolite einher, insbesondere ATP und NADH. Eines der wenigen abnehmenden Metabolite ist ADP, was in Kombination mit dem Anstieg von ATP zu einem starken Anstieg der ATP/ADP-Verhältnisse in der β-Zelle bei steigender Glukose führt. Die Insulinsekretion ist von ATP/ADP abhängig, was zur glukosestimulierten Insulinsekretion führt. Der beobachtete glukoseabhängige Anstieg glykolytischer Zwischenprodukte und die daraus resultierende Veränderung der ATP/ADP-Verhältnisse und der Insulinsekretion ist ein robustes Phänomen, das über Datensätze, experimentelle Systeme und Spezies hinweg beobachtet wird. Die Modellvorhersagen der glukoseabhängigen Reaktion glykolytischer Zwischenprodukte und der biphasischen Insulinsekretion stimmen gut mit experimentellen Messungen überein. Unser Modell sagt voraus, dass Faktoren, die ATP-Verbrauch, ATP-Bildung, Hexokinase, Phosphofructokinase und die ATP/ADP-abhängige Insulinsekretion beeinflussen, einen wesentlichen Effekt auf die GSIS haben. Zusammenfassend haben wir einen systematischen Modellierungs-Workflow für Pathway-Modelle entwickelt und angewendet, der es uns ermöglichte, Einblicke in zentrale Mechanismen der GSIS in der pankreatischen β-Zelle zu gewinnen.'
bachelor_thesis_beatrice.stemmer.mallol:
  title:
    sha: 7995f3182897931a
    text: 'Bachelorarbeit Beatrice Stemmer Mallol'
  short:
    sha: 97019355451f31a7
    text: 'Beatrice Stemmer Mallol reichte ihre Bachelorarbeit zur Entwicklung eines PBPK-Modells von Talinolol ein'
  abstract:
    sha: a30dcba4581986f1
    text: 'Herzlichen Glückwunsch an Bea zur erfolgreichen Einreichung ihrer Bachelorarbeit über ein physiologiebasiertes pharmakokinetisches (PBPK) Modell des Sondenwirkstoffs Talinolol zur Charakterisierung des intestinalen P-Glykoproteins. Talinolol, ein kardioselektiver Betablocker, der zur Behandlung verschiedener Herz-Kreislauf-Erkrankungen und Tachyarrhythmien eingesetzt wird, wird häufig als Sondenwirkstoff für den intestinalen Efflux-Transporter P-Glykoprotein verwendet. Im menschlichen Körper spielt P-gp eine entscheidende Rolle, da es in verschiedenen Geweben verteilt ist, um vor potenziell toxischen Substanzen zu schützen und gleichzeitig die Elimination von Fremdstoffen zu beschleunigen. Durch den Einsatz von Talinolol zur P-gp-Phänotypisierung können Forschende Faktoren bewerten, die den P-gp-vermittelten Transport beeinflussen, etwa genetische Polymorphismen von P-gp und dessen Verteilung entlang des Darms. Beas Arbeit präsentiert einen umfassenden Datensatz zur Pharmakokinetik von Talinolol, also der Untersuchung, wie der Körper Arzneimittel absorbiert, verteilt, metabolisiert und ausscheidet. Diese Daten wurden genutzt, um ein PBPK-Modell für Talinolol zu entwickeln, das detaillierte Einblicke in dessen Verhalten im Körper liefert. Das neue Modell untersucht den Einfluss zahlreicher Faktoren auf die Pharmakokinetik von Talinolol, einschließlich der genetischen Varianten von P-gp, der enzymatischen Aktivität der Transporter OATP2B1 und OATP1B1 sowie der ortsspezifischen Verteilung der Proteine P-gp und OATP2B1 im Darm. Zudem untersucht es den Einfluss von Erkrankungen wie Leberzirrhose und Niereninsuffizienz.'
defense_jan_grzegorzewski:
  title:
    sha: fa0db90c085d6e68
    text: 'Promotionsverteidigung von Jan Grzegorzewski'
  short:
    sha: c521d6c4048a70d9
    text: 'Jan Grzegorzewski verteidigte seine Doktorarbeit zur physiologiebasierten pharmakokinetischen Modellierung (PBPK) für dynamische Leberfunktionstests und die Phänotypisierung von Cytochrom P450 (CYP).'
  abstract:
    sha: 57e6a1317884199f
    text: 'Herzlichen Glückwunsch an Jan Grzegorzewski zur erfolgreichen Verteidigung seiner Doktorarbeit zur physiologiebasierten pharmakokinetischen Modellierung (PBPK) für dynamische Leberfunktionstests und die Phänotypisierung von Cytochrom P450 (CYP). Jan entwickelte die umfangreiche offene Pharmakokinetik-Datenbank PK-DB, die dazu beitrug, demografische Verzerrungen und Fehler in der bestehenden pharmakokinetischen Literatur aufzuzeigen. Seine Forschung umfasst eine Metaanalyse zur Koffein-Pharmakokinetik, bei der mehrere Faktoren identifiziert wurden, die die Leberfunktion und die CYP1A2-Aktivität beeinflussen. Darüber hinaus entwickelte er ein PBPK-Modell zur Vorhersage individueller Plasmakonzentrationen von Dextromethorphan basierend auf dem CYP2D6-Genotyp und physiologischen Merkmalen. Seine Arbeit soll die Präzision dynamischer Leberfunktionstests deutlich verbessern und die personalisierte Medizin voranbringen.'
humboldt_internship:
  title:
    sha: 56300ba27ee0629b
    text: 'Xenia Petukhova und Zahra Bahri starten das Humboldt Internship Program'
  short:
    sha: 477f7359162c69c7
    text: 'Humboldt Internship Program 2023 - Computergestützte Modellierung der Arzneimittelentgiftung - Ein systemmedizinischer Ansatz'
  abstract:
    sha: 26fc54e0b5cb13d5
    text: 'Wir begrüßen Xenia und Zahra in unserer Gruppe für das Humboldt Internship Program 2023. Xenia und Zahra werden ein physiologiebasiertes pharmakokinetisches (PBPK) Modell für Inulin und Kreatinin zur Bestimmung der glomerulären Filtrationsrate (GFR) entwickeln. Unser Ziel ist es, ein tieferes Verständnis des Einflusses verschiedener Inulin-Protokolle auf die GFR-Messung sowie des Einflusses physiologischer Faktoren, wie der Körperzusammensetzung, auf die GFR-Bestimmung mittels Inulin zu gewinnen. Darüber hinaus soll es unser Verständnis davon verbessern, wie Variationen in der Kreatininproduktion, der Muskelmasse und der tubulären Sekretion von Kreatinin die eGFR-Berechnung beeinflussen.'
keynote_wcm2023:
  title:
    sha: 9e6aa9845365eb28
    text: 'Keynote: Advancing Liver Function Assessment: Personalized and Stratified Approaches with Standardized Computational Models and Data'
  short:
    sha: a0b156cdb66df9d9
    text: 'Keynote-Vortrag beim Workshop on Computational Models in Biology and Medicine 2023, organisiert von Nicole Radde und Sebastian Höpfl.'
  abstract:
    sha: f96f36a167dcd1e5
    text: 'Wesentliche Voraussetzungen für die praktische Anwendung und Übertragung computergestützter Modelle sind: i) Reproduzierbarkeit der Ergebnisse; ii) Wiederverwendbarkeit und Erweiterbarkeit der Modelle; iii) Verfügbarkeit der Daten; und iv) Strategien zur Modellstratifizierung und -individualisierung. In dieser Studie präsentieren wir einen Modellierungs-Workflow, der auf diese entscheidenden Aspekte zugeschnitten ist, mit Fokus auf Leberfunktionstests. Die Bewertung der Leberfunktion ist eine zentrale Aufgabe in der Hepatologie, doch die präzise Quantifizierung der Leberfunktion bleibt eine klinische Herausforderung. Dynamische Leberfunktionstests bieten eine vielversprechende Methode zur nicht-invasiven In-vivo-Bewertung von Leberfunktion und metabolischer Phänotypisierung. Diese klinischen Tests bestimmen die Leberfunktion anhand der Elimination einer bestimmten Testsubstanz und liefern so Informationen über die metabolische Kapazität der Leber. Wir setzten physiologiebasierte Ganzkörper-Pharmakokinetik-(PBPK)-Modelle ein, um diese Tests zu simulieren, welche Absorption, Verteilung, Metabolismus und Eliminationsprozesse umfassen. PBPK-Modelle dienen als leistungsfähige Instrumente zur Untersuchung des Arzneimittelstoffwechsels und seiner Auswirkungen auf den menschlichen Körper. In dieser Forschung zeigen wir unsere Bemühungen, PBPK-Modelle als digitale Zwillinge für metabolische Phänotypisierung und Leberfunktionsbewertung einzusetzen. Um unsere Modelle zu entwickeln und zu validieren, haben wir die erste offene Pharmakokinetik-Datenbank PK-DB geschaffen, die kuratierte Daten aus über 600 klinischen Studien enthält. Unsere Modelle sind individualisierbar und stratifizierbar und ermöglichen die Simulation von Lebensstilfaktoren und Effekten gleichzeitiger Arzneimittelgabe auf den Arzneimittelstoffwechsel. Wir haben unsere Modelle auf verschiedene klinische Fragestellungen angewendet, etwa zur Simulation individueller Ergebnisse nach Hepatektomie mittels eines Indocyaningrün-Modells und zur Untersuchung des Einflusses von CYP2D6-Genvarianten mittels eines mit Arzneimittel-Gen-Interaktionen integrierten Dextromethorphan-Modells. Diese Modelle sind hierarchisch aufgebaut und beschreiben metabolische und andere biologische Prozesse in Organen wie Leber und Niere, verbunden mit der Ganzkörperphysiologie. Alle Modelle und Daten sind reproduzierbar zur Wiederverwendung zugänglich, kodiert in der Systems Biology Markup Language (SBML). In dieser Studie geben wir einen Überblick über PBPK-Modelle und zeigen, wie SBML, COMBINE-Standards und die FAIR-Prinzipien Modellentwicklung, -kopplung und -wiederverwendung erleichtern können.'
reproducible_research_preprint:
  title:
    sha: e4727a5edb1d259d
    text: 'Preprint: Eleven Strategies for Making Reproducible Research and Open Science Training the Norm at Research Institutions'
  short:
    sha: 5835ca76c099ec8c
    text: 'Wir stellen 11 Strategien vor, um #OpenScience und #ReproducibleResearch zum Standard an Forschungseinrichtungen zu machen, mit Tipps zur Umsetzung und Ressourcen. Lassen Sie uns gemeinsam dafür sorgen, dass diese Praktiken in der Wissenschaftsgemeinschaft zum Standard werden!'
  abstract:
    sha: 9018d509efb70b7e
    text: 'Über Disziplinen hinweg erkennen Forschende zunehmend, dass Open-Science- und reproduzierbare Forschungspraktiken den wissenschaftlichen Fortschritt beschleunigen können, indem sie anderen die Wiederverwendung von Forschungsergebnissen ermöglichen und strenge Forschung fördern, die eher vertrauenswürdige Ergebnisse liefert. Während Initiativen, Schulungsprogramme und Förderrichtlinien Forschende dazu ermutigen, reproduzierbare Forschung und Open-Science-Praktiken zu übernehmen, sind diese Praktiken in vielen Fachbereichen noch unüblich. Forschende benötigen Schulungen, um diese Praktiken in ihre tägliche Arbeit zu integrieren. Wir organisierten in Zusammenarbeit mit dem German Reproducibility Network eine virtuelle Brainstorming-Veranstaltung, um Strategien zu diskutieren, mit denen reproduzierbare Forschung und Open-Science-Schulungen zum Standard an Forschungseinrichtungen werden können. Hier skizzieren wir elf Strategien, konzentriert auf drei Bereiche: (1) das Anbieten von Schulungen, (2) die Anpassung von Bewertungskriterien für Forschung und Programmanforderungen, und (3) den Aufbau von Communities. Wir geben einen kurzen Überblick über jede Strategie, bieten Tipps zur Umsetzung und verweisen auf Ressourcen. Unser Ziel ist es, Mitglieder der Forschungsgemeinschaft zu ermutigen, kreativ über die vielen Möglichkeiten nachzudenken, wie sie beitragen und zusammenarbeiten können, um Communities aufzubauen und reproduzierbare Forschung und Open-Science-Schulungen zum Standard zu machen. Forschende können dabei in ihren Rollen als Wissenschaftlerinnen und Wissenschaftler, Betreuende, Mentorinnen und Mentoren, Lehrende sowie als Mitglieder von Curriculums-, Einstellungs- oder Bewertungsausschüssen aktiv werden. Institutionelle Führungskräfte sowie Forschungsverwaltung und -unterstützungspersonal können den Fortschritt beschleunigen, indem sie Veränderungen in ihren Einrichtungen umsetzen.'
chlorzoxazone_preprint:
  title:
    sha: 877030cbf07416c2
    text: 'Preprint: A physiologically based pharmacokinetic model for CYP2E1 phenotyping via chlorzoxazone'
  short:
    sha: d7a27eadbe1da5f7
    text: 'Unser neuester Preprint ist jetzt auf bioRxiv verfügbar: A physiologically based pharmacokinetic model for CYP2E1 phenotyping via chlorzoxazone'
  abstract:
    sha: 08fc384f98dd91ac
    text: 'Wir haben ein physiologiebasiertes pharmakokinetisches (PBPK) Modell zur CYP2E1-Phänotypisierung mittels Chlorzoxazon entwickelt. Dieses Modell berücksichtigt verschiedene Faktoren, die die Aktivität von CYP-Enzymen beeinflussen können, wie Genetik, Ernährung, Alter, Umweltfaktoren und Erkrankungen, und ist damit ein hochwirksames und zuverlässiges Werkzeug zur Bewertung der In-vivo-Aktivität des CYP2E1-Enzyms. Besonders spannend an dieser Forschung ist, dass sie den Effekt von Ethanolkonsum und Leberbeeinträchtigung auf die Ergebnisse der metabolischen Phänotypisierung mit Chlorzoxazon berücksichtigt. Das bedeutet, dass das Modell nicht nur präzise, sondern auch äußerst praxistauglich ist, da es Faktoren berücksichtigt, die in der klinischen Praxis häufig auftreten. Der umfangreiche pharmakokinetische Datensatz für Chlorzoxazon und das validierte PBPK-Modell dürften einen bedeutenden Einfluss auf das Gebiet der Pharmakokinetik haben, da sie ein zuverlässiges und umfassendes Werkzeug zur Bewertung der CYP2E1-Aktivität in einer Vielzahl klinischer Kontexte bieten. Diese Forschung stellt einen bedeutenden Fortschritt in unserem Verständnis der Faktoren dar, die die Aktivität von CYP-Enzymen beeinflussen, und verspricht einen erheblichen Einfluss auf die Entwicklung neuer Arzneimittel und die Optimierung bestehender zu haben.'
michael_stifel_price:
  title:
    sha: 40aa146f2c285043
    text: 'Michael Stifel Price zur Förderung interdisziplinärer, datengetriebener Forschung'
  short:
    sha: 8d700976db338186
    text: 'M. Albadry, S. Höpfl und M. König gewannen den QuaLiPerF Michael Stifel Price für interdisziplinäre, datengetriebene Forschung.'
  abstract:
    sha: 9ecfc6b6499f7847
    text: 'M. Albadry, S. Höpfl und M. König gewannen den QuaLiPerF Michael Stifel Price für interdisziplinäre, datengetriebene Forschung für die Studie<br><br> Albadry M, Höpfl S, Ehteshamzad N, König M, Böttcher M, Neumann J, Lupp A, Dirsch O, Radde N, Christ B, Christ M, Schwen LO, Laue H, Klopfleisch R, Dahmen U. <b>Periportal steatosis in mice affects distinct parameters of pericentral drug metabolism.</b> Sci Rep. 2022 Dec 17;12(1):21825. doi: <a href="https://doi.org/10.1038/s41598-022-26483-6">10.1038/s41598-022-26483-6</a>.<br><br> Die Studie wurde im Rahmen eines Projekts zur Modellierung der Pharmakokinetik steatotischer Mäuse und zur Untersuchung des Einflusses periportaler Steatose auf Parameter des Arzneimittelstoffwechsels durchgeführt. Mit dem interdisziplinären Ansatz von QuaLiPerF arbeiteten wir mit drei Fachbereichen der Lebenswissenschaften zusammen: Mohamed Albadry für die Datengenerierung, Matthias König für die Datenanalyse und Sebastian Höpfl für die Unsicherheitsquantifizierung. Die Datengenerierung umfasste die Durchführung von Tierversuchen, pharmakokinetischen Studien sowie die Analyse der Steatose durch Quantifizierung ihrer räumlichen Verteilung, zonierten Expression und Aktivität von Arzneimittelstoffwechselenzymen (CYP).'
jib_editorial:
  title:
    sha: 24d37a5bca75383b
    text: 'Publikation: Specifications of standards in systems and synthetic biology: status and developments in 2022 and the COMBINE meeting 2022'
  short:
    sha: b1119b1e1b6ddd2a
    text: 'Unser Überblick über Spezifikationen in der System- und synthetischen Biologie mit einem kurzen Überblick über die COMBINE 2022 ist verfügbar.'
  abstract:
    sha: c81b95d5c5210e8a
    text: 'Das Journal of Integrative Bioinformatics hat unser Editorial für eine Sonderausgabe veröffentlicht, die aktualisierte Spezifikationen der COMBINE-Standards in System- und synthetischer Biologie bereitstellt. Die Ausgabe 2022 umfasst drei Aktualisierungen der Standards, nämlich CellML 2.0.1, SBML Level 3 Package: Spatial Processes, Version 1, Release 1, und Synthetic Biology Open Language (SBOL) Version 3.1.0. Diese Publikation ist eine wertvolle Ressource für Forschende, die mit den neuesten Entwicklungen der COMBINE-Standards Schritt halten möchten. Darüber hinaus bietet der redaktionelle Teil der Ausgabe einen kurzen Überblick über das COMBINE-2022-Treffen in Berlin.'
pancreas_preprint:
  title:
    sha: 9ba94d7faee59fe9
    text: 'Preprint: A consensus model of glucose-stimulated insulin secretion in the pancreatic beta-cell'
  short:
    sha: d9c1710d6aa1f74f
    text: 'Unser neuester Preprint ist jetzt auf bioRxiv verfügbar: A consensus model of glucose-stimulated insulin secretion in the pancreatic beta-cell'
  abstract:
    sha: e9f09852dba497b3
    text: 'Die Bauchspeicheldrüse spielt eine entscheidende Rolle bei der Aufrechterhaltung der Glukosehomöostase durch die Sekretion von Hormonen aus den Langerhans-Inseln. Die glukosestimulierte Insulinsekretion (GSIS) durch die pankreatische Betazelle ist der wichtigste Mechanismus zur Senkung erhöhter Plasmaglukosewerte. Hier präsentieren wir einen systematischen Modellierungs-Workflow zur Entwicklung kinetischer Pathway-Modelle mittels der Systems Biology Markup Language (SBML). Der Workflow wurde angewendet, um das erste Konsensmodell der GSIS in der pankreatischen Betazelle zu erstellen, basierend auf experimentellen und klinischen Daten aus 39 Studien, die 50 Jahre Forschung zu Bauchspeicheldrüse, Inseln und Betazellen bei Menschen, Ratten, Mäusen und Zelllinien umfassen. Das Modell besteht aus einer detaillierten Glykolyse sowie Gleichungen für die Insulinsekretion, gekoppelt an den zellulären Energiezustand (ATP/ADP-Verhältnis). Zentrale Ergebnisse unserer Arbeit sind, dass bei der GSIS ein glukoseabhängiger Anstieg nahezu aller Zwischenprodukte der Glykolyse zu beobachten ist. Dieser Anstieg glykolytischer Metabolite geht mit einem Anstieg der Energiemetabolite einher, insbesondere ATP und NADH. Eines der wenigen abnehmenden Metabolite ist ADP, was in Kombination mit dem Anstieg von ATP zu einem starken Anstieg der ATP/ADP-Verhältnisse in der Betazelle bei steigender Glukose führt. Die Insulinsekretion ist von ATP/ADP abhängig, was zur glukosestimulierten Insulinsekretion führt. Der beobachtete glukoseabhängige Anstieg glykolytischer Zwischenprodukte und die daraus resultierende Veränderung der ATP/ADP-Verhältnisse und der Insulinsekretion ist ein robustes Phänomen, das über Datensätze, experimentelle Systeme und Spezies hinweg beobachtet wird.'
frances_narudeem:
  title:
    sha: 917dff9296f1beb1
    text: 'PBPK-Modellierung von Sorafenib und Gd-EOB-DTPA'
  short:
    sha: 12ec4611d4b6429d
    text: 'Frances Okibedi und Narudeem Sojimade werden Modelle des Krebsmedikaments Sorafenib bei HCC sowie des Leberkontrastmittels Gd-EOB-DTPA entwickeln.'
  abstract:
    sha: aa053af76011816c
    text: '<p> Im Rahmen dieses Projekts wird eine hochwertige Datenbank pharmakokinetischer Daten zu Sorafenib aufgebaut, die in der systemischen Therapie des hepatozellulären Karzinoms eingesetzt werden. Basierend auf diesem pharmakokinetischen Datensatz wird ein physiologiebasiertes pharmakokinetisches (PBPK) Modell zur Bewertung der systemischen Sorafenib-Therapie bei Leberkrebs erstellt. Das Modell wird genutzt, um wichtige klinisch relevante Fragestellungen zu beantworten, etwa (1) Sorafenib ist bei fortgeschrittener Leberzirrhose kontraindiziert, (2) genetische Varianten der OATP-Aufnahmetransporter können die Wirksamkeit von Sorafenib verändern, (3) CYP3A4-Substrate führen zu Arzneimittelinteraktionen mit Sorafenib. </p> <p> Unter Nutzung etablierter Datenkuratierungs-Pipelines wird dieses Projekt unsere Pharmakokinetik-Datenbank PK-DB um Literaturdaten zu Gd-EOB-DTPA erweitern. Basierend auf diesem pharmakokinetischen Datensatz wird ein physiologiebasiertes pharmakokinetisches (PBPK) Modell zur Bewertung der Pharmakokinetik von Gd-EOB-DTPA und seines Einsatzes als MRT-Kontrastmittel erstellt. Das Modell wird genutzt, um wichtige klinisch relevante Fragestellungen zu beantworten, etwa (1) den Effekt renaler und hepatischer Beeinträchtigung auf die Pharmakokinetik von Gd-EOB-DTPA, (2) den Effekt von Perfusion und OATP auf die Pharmakokinetik von Gd-EOB-DTPA, (3) die Beziehung zwischen Konzentration und MRT-Abschwächung. </p> '
xresearch2023:
  title:
    sha: b66284ae3d1970e6
    text: 'X-Research Group - Digitale Zwillinge für die Behandlung von Hypertonie'
  short:
    sha: 916e17afa0f146f8
    text: 'M. König erhält Förderung der Berlin University Alliance und der DFG für die X-Student Research Group: Digitale Zwillinge für die Behandlung von Hypertonie'
  abstract:
    sha: f822e63746fd4170
    text: '<p> Das Verständnis der Pharmakokinetik eines Arzneimittels - wie es vom Körper absorbiert, verteilt, metabolisiert und ausgeschieden wird - und seiner Pharmakodynamik - wie es den Körper beeinflusst - ist eine zentrale Herausforderung in der Behandlung von Patientinnen und Patienten. ACE-Hemmer (Angiotensin-converting-Enzym-Hemmer) und Diuretika sind zwei Arzneimittelklassen zur Behandlung von Bluthochdruck. Beide gehören aufgrund der hohen Prävalenz von Hypertonie in einer alternden Gesellschaft zu den am häufigsten verschriebenen Arzneimitteln. </p> <p> In dieser X-Student Research Group werden wir physiologiebasierte pharmakokinetische Modelle des Diuretikums Hydrochlorothiazid und des ACE-Hemmers Lisinopril entwickeln. Der methodische Ansatz ist eine Kombination aus Vorlesungen, Tutorien und praktischer Arbeit der Studierenden. Das Forschungsprojekt richtet sich an Studierende mit MINT-Hintergrund (Mathematik, Informatik, Naturwissenschaft, Technik), einschließlich Studierender der Biologie, Informatik und Medizin. Grundlegende Programmierkenntnisse in Python sind erforderlich. </p> <p> Mit den <a href="https://www.berlin-university-alliance.de/commitments/teaching-learning/sturop/research-groups/index.html">X-Student Research Groups</a> unterstützt die Berlin University Alliance Forschungsteams aus Nachwuchsforschenden und Studierenden. Ziel ist es, Studierende in aktuelle Forschungsprojekte der Allianzpartner einzubinden und ihnen zu ermöglichen, bereits während ihres Studiums an (Spitzen-)Forschung teilzunehmen. </p> <p> Gefördert im Rahmen der Exzellenzstrategie des Bundes und der Länder durch die <a href="https://www.berlin-university-alliance.de/">Berlin University Alliance</a>. </p>'
petab_editor:
  title:
    sha: 50d6bebe905cae3f
    text: 'M. König wurde zum PEtab-Editor gewählt (2023-2026)'
  short:
    sha: a084685a06093444
    text: 'Stolz darauf, zum Editor für PEtab gewählt worden zu sein, ein Datenformat zur Spezifikation von Parameterschätzproblemen in der Systembiologie.'
  abstract:
    sha: 04a518b6f9ce3c5c
    text: 'PEtab ist ein Datenformat zur Spezifikation von Parameterschätzproblemen in der Systembiologie. PEtab baut auf SBML auf und basiert auf tabulatorgetrennten Werten (TSV-Dateien). Es ist als standardisierter Weg gedacht, Informationen für die Parameterschätzung bereitzustellen, die über den aktuellen Umfang von SBML hinausgehen. Dazu gehören beispielsweise: (1) die Spezifikation und Verknüpfung von Messungen mit Modellen; (2) die Definition von Modell-Outputs; (3) die Spezifikation von Rauschmodellen; (4) die Spezifikation von Parametergrenzen für die Optimierung; (5) die Spezifikation mehrerer Simulationsbedingungen mit potenziell gemeinsamen Parametern. Matthias König wurde von März 2023 bis März 2026 zum PEtab-Editor gewählt.'
simvastatin_preprint:
  title:
    sha: 518131ce3bb4dc3f
    text: 'Preprint: Simvastatin therapy in different subtypes of hypercholesterolemia'
  short:
    sha: 6ed7a9c6c2fc1809
    text: 'Unser neuester Preprint ist jetzt auf medRxiv verfügbar: Simvastatin therapy in different subtypes of hypercholesterolemia - a physiologically based modelling approach.'
  abstract:
    sha: 06e7e063f878bd40
    text: 'Hypercholesterinämie ist eine vielschichtige Plasmalipidstörung mit heterogenen Ursachen, einschließlich Lebensstil- und genetischer Faktoren. Ein zentrales Merkmal der Hypercholesterinämie sind erhöhte Plasmaspiegel von Low-Density-Lipoprotein-Cholesterin (LDL-C). Mehrere genetische Varianten wurden mit Hypercholesterinämie in Verbindung gebracht, bekannt als familiäre Hypercholesterinämie (FH). Wichtige Varianten betreffen den LDL-Rezeptor (LDLR), der die Aufnahme von LDL-C aus dem Plasma vermittelt, Apolipoprotein B (APOB), das an der Bindung von LDL-C an den LDLR beteiligt ist, sowie die Proproteinkonvertase Subtilisin/Kexin Typ 9 (PCSK9), die den Abbau des LDLR moduliert. Eine typische Behandlung der Hypercholesterinämie ist die Statin-Medikation, wobei Simvastatin eines der am häufigsten verschriebenen Statine ist. In dieser Arbeit wurde die LDL-C-senkende Therapie mit Simvastatin bei Hypercholesterinämie mittels eines computergestützten Modellierungsansatzes untersucht. Es wurde ein physiologiebasiertes pharmakokinetisches Modell von Simvastatin, integriert mit einem pharmakodynamischen Modell des Plasma-LDL-C (PBPK/PD), auf Basis umfangreicher Datenkuratierung entwickelt. Eine zentrale Komponente des Modells ist der LDL-C-Umsatz durch die Leber, bestehend aus: hepatischer Cholesterinsynthese mit den Schlüsselenzymen HMG-CoA-Reduktase und HMG-CoA-Synthase; Cholesterinexport aus der Leber als VLDL-C; De-novo-Synthese des LDLR; Transport des LDLR zur Membran; Bindung von LDL-C durch den LDLR über APOB; Endozytose des LDLR-LDL-C-Komplexes; Recycling des LDLR aus dem Komplex. Das Modell wurde angewendet, um die Effekte der Simvastatin-Therapie bei Hypercholesterinämie unterschiedlicher Ursachen im LDLR-Pathway, entsprechend verschiedener Subtypen der Hypercholesterinämie, zu untersuchen. Modellvorhersagen zur LDL-C-senkenden Therapie wurden mit unabhängigen klinischen Datensätzen validiert. Zentrale Ergebnisse sind: (i) der hepatische LDLR-Umsatz ist zwischen den FH-Klassen stark heterogen; (ii) trotz dieser Heterogenität führt die Simvastatin-Therapie unabhängig von der Klasse zu einer konsistenten Senkung des Plasma-LDL-C; und (iii) die Simvastatin-Therapie zeigt eine dosisabhängige Senkung des LDL-C. Unser Modell legt nahe, dass die zugrunde liegende Ursache der Hypercholesterinämie die Simvastatin-Therapie nicht beeinflusst. Darüber hinaus unterstützt unser Modell die Behandlungsstrategie einer schrittweisen Dosisanpassung zur Erreichung der Ziel-LDL-C-Werte. Sowohl das Modell als auch die Datenbank sind frei zur Wiederverwendung verfügbar.'
atlas:
  title:
    sha: a16edab3d7bbb01d
    text: 'ATLAS - AI and Simulation for Tumor Liver ASsessment'
  short:
    sha: 1a9634b70d54e32e
    text: 'Das BMBF fördert unser Verbundprojekt ATLAS im Rahmen von „Computational Life Sciences - AI Methods for Systems Medicine“.'
  abstract:
    sha: ac15e8a851cf7f9a
    text: 'Leberkrebs ist die zweithäufigste Ursache krebsbedingter Todesfälle. Diagnose und Behandlung sind zeitkritisch und erfordern hochgradig patientenspezifische Diagnose- und Behandlungspfade. Die medizinische Entscheidungsfindung basiert auf einer Vielzahl voneinander abhängiger Faktoren aus unterschiedlichen medizinischen Fachbereichen, Erfahrungswerten und klinischen Leitlinien. Die Berücksichtigung aller Entscheidungsfaktoren in Kombination mit den möglichen therapeutischen Ansätzen stellt für Ärztinnen und Ärzte eine große Herausforderung dar und kann selbst in einem interdisziplinären Tumorboard oft nicht optimal gelöst werden. In diesem Projekt entwickeln wir ATLAS, ein Entscheidungsunterstützungswerkzeug, das Klinikerinnen und Kliniker bei dieser Herausforderung maßgeblich unterstützen soll. Basierend auf KI-Methoden verarbeitet ATLAS alle relevanten Patientendaten aus Datenbanken, systemmedizinischen und kontinuumsbiomechanischen In-silico-Prognosemodellen sowie individuelle Patientendaten. Das Werkzeug wird in einem Co-Design-Ansatz von Expertinnen und Experten aus chirurgischer Onkologie, mathematischer Modellierung und maschinellem Lernen entwickelt. Die gewählten Technologien verbinden das automatisierte Verständnis einer hochkomplexen Patientensituation durch Simulation von Leberfunktionen mit Expertenwissen und ontologiegestütztem Lernen mittels Wissensgraphen aus retrospektiven Fällen von Lebertumoren. ATLAS wird auf einer detaillierten historischen Datenkohorte von mehr als 6.000 Patientinnen und Patienten mit Lebertumoren basieren und anhand von Fallstudien am Universitätsklinikum Jena evaluiert. Die Integration von medizinischem Expertenwissen, mathematischer Modellierung und künstlicher Intelligenz stellt einen hochgradig originellen und vielversprechenden Ansatz für eine qualitativ hochwertige Diagnose und Behandlung von Lebertumoren dar, der zu einer patientenspezifischen Verbesserung der Prognose führt. Die aus diesen Projekten gewonnenen wissenschaftlichen Erkenntnisse eröffnen Möglichkeiten zur Übertragung auf Malignome in anderen Organen, etwa Lunge, Niere oder Gehirn. Die Entwicklung von Werkzeugen und Demonstratoren wird nachhaltige Verwertungspfade für zukünftige kommerzielle Anwendungen schaffen.'
