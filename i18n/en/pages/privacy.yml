  text: 5. Your Rights
rightsText:
  sha: 6a3ec088d1b9ed8e
  text: >-
    Within the scope of applicable legal provisions, you have the right at any time to free
    information about your stored personal data, its origin and recipients, and the purpose of
    the data processing, as well as a right to rectification, blocking or deletion of this data,
    and a right to data portability and a right to object to the processing. For this and for any
    further questions on the topic of personal data, you may contact us at any time using the
    contact details given in the Legal Notice. You also have the right to lodge a complaint with
    the competent data protection supervisory authority.
