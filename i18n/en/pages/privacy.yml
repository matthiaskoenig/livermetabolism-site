logfilesHeading:
  sha: ab00bc04fe92d57f
  text: 2. Server Log Files
logfilesText:
  sha: 61a8ec68cf945e43
  text: >-
    When you access this website, the hosting provider automatically collects information in
    so-called server log files, which your browser automatically transmits. These are: browser
    type and version, operating system used, referrer URL, host name of the accessing computer,
    time of the server request, and IP address. This data is not merged with other data sources
    and serves exclusively to ensure trouble-free operation and the security of our information
    technology systems (legal basis: Art. 6 Abs. 1 lit. f DSGVO, legitimate interest).
