# 4000 is the default port that Jekyll uses to serve pages via the jekyll serve command
# 35729 is the port used by livereload, which you may or may not use? I’m not using it.
# 3000? IDK
# 80 is just remapping port 4000 externally.

# https://github.com/envygeeks/jekyll-docker/blob/master/README.md

services:
  
  jekyll:
    # Gemfile.lock is gitignored/regenerated fresh each run (not committed) -
    # dropping it here guards against a stale lockfile left on disk from
    # before a Gemfile change (e.g. pinning an old Bundler version that's
    # incompatible with this image's Ruby, which crashes bundle install).
    command: bash -c "rm -f Gemfile.lock && bundle install && bundle exec jekyll build"
    image: jekyll/jekyll:4.4.1
    volumes:
      - $PWD:/srv/jekyll
      - $PWD/app/vendor/bundle:/usr/local/bundle
    environment:
      - JEKYLL_ENV=production
    ports:
      - "4000:4000"
      - "35729:35729"
      - "3000:3000"
    networks:
      - default

    