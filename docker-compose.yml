# Self-hosted deployment: serve the built site (dist/, produced by
# docker-compose-build.yml) with nginx. Used by deploy.sh on the server;
# NGINX_PORT lets a local test bind another port (NGINX_PORT=8080 docker compose up).
services:
  nginx:
    image: nginx:1.31.5-alpine
    volumes:
      - $PWD/dist:/usr/share/nginx/html:ro
      - $PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    restart: always
    networks:
      - frontend

networks:
  frontend:
