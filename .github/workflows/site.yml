name: Site

on:
  pull_request:
  push:
    branches: [main]
  # One hour after the data workflow (github-data.yml, 05:00 UTC), so every
  # build-time number — the publication citations, the Scholar metrics, the
  # GitHub stars, the homepage strip — is at most a day old. The deploy job's
  # condition (not a pull request, ref refs/heads/main) covers a scheduled run.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - run: uv run pytest tests/ -q
      - run: uv run python -m src.data

  build:
    name: build
    needs: validate
    runs-on: ubuntu-latest
    env:
      # interim project-pages URL; switch to SITE=https://livermetabolism.com
      # and BASE=/ (plus public/CNAME) when the domain is attached
      SITE: https://matthiaskoenig.github.io
      BASE: /livermetabolism-site/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
