name: Site

on:
  pull_request:
  push:
    branches: [main]
  # One hour after the data workflow (github-data.yml, 05:00 UTC), so every
  # build-time number — the publication citations, the Scholar metrics, the
  # GitHub stars, the homepage strip — is at most a day old. The deploy job's
  # condition (not a pull request, ref refs/heads/main) covers a scheduled run.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a cancelled deployment leaves the published site as it was, the newer run deploys
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: true
      - run: uv python install
      - run: uv sync
      - run: uv run pytest tests/ -q
      - run: uv run python -m src.data

  build:
    name: build
    needs: validate
    runs-on: ubuntu-latest
    env:
      # interim project-pages URL; switch to SITE=https://livermetabolism.com
      # and BASE=/ (plus public/CNAME) when the domain is attached
      SITE: https://matthiaskoenig.github.io
      BASE: /livermetabolism-site/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check translation catalogs
        run: npm run i18n:check
      - run: npm run build
      # the browser is cached per version of the lock file, the system
      # dependencies are installed by every run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
