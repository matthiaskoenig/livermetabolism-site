name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check that the tag matches package.json and pyproject.toml
        run: |
          pkg=$(node -p "require('./package.json').version")
          py=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          test "$pkg" = "${{ github.ref_name }}" && test "$py" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} != package.json $pkg / pyproject $py"; exit 1; }
          test -f "release-notes/${{ github.ref_name }}.md"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: "release-notes/${{ github.ref_name }}.md"
          draft: false
          prerelease: false
