name: GitHub data

# Daily snapshots committed to the orphan branch `github-data`:
#   github.json  — stars, releases, commits and activity of every repository in
#                  data/software.yml, read by the research page.
#   scholar.json — the citation metrics of the Google Scholar profile, read by
#                  the publications page.
#   citations.json — the per-paper citation counts and open-access status from
#                  OpenAlex, by DOI, read by the publications page.
# All three are read from the raw URL at build time and in the browser, so the
# numbers stay fresh without a redeploy. The site workflow only runs on main,
# pull requests and its own daily schedule, so this push never triggers a
# deployment.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-data
  cancel-in-progress: false

jobs:
  github-data:
    name: github-data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch:github -- github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The worktree is prepared before the Scholar fetch so that the previous
      # scholar.json is in place: the script reads its accumulated history from
      # the very path it writes. A missing file is normal on the first run.
      - name: Prepare the github-data worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin github-data; then
            git fetch origin github-data
            git worktree add ../data origin/github-data
          else
            git worktree add --detach ../data
            git -C ../data checkout --orphan github-data
            git -C ../data rm -rfq . || true
          fi
      # Scholar has no API and may block the runner. That must never fail the
      # GitHub snapshot, and a failed fetch writes nothing, so the previous
      # scholar.json is committed again unchanged.
      - name: Fetch Google Scholar
        continue-on-error: true
        run: npm run fetch:scholar -- ../data/scholar.json
      # OpenAlex needs no key; OPENALEX_MAILTO (a repository variable, unset by
      # default) only asks for the polite pool. A failed fetch writes nothing,
      # so the previous citations.json is committed again unchanged.
      - name: Fetch citations
        continue-on-error: true
        run: npm run fetch:citations -- ../data/citations.json
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      - name: Commit to the github-data branch
        run: |
          cp github.json ../data/github.json
          cd ../data
          git add github.json
          # The two continue-on-error fetches may not have produced a file yet.
          for f in scholar.json citations.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update data snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:github-data
