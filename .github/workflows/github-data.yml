name: GitHub data

# Daily snapshots committed to the orphan branch `github-data`:
#   github.json  — stars, releases, commits and activity of every repository in
#                  data/software.yml, read by the research page.
#   scholar.json — the citation metrics of the Google Scholar profile, read by
#                  the publications page.
#   citations.json — the per-paper citation counts and open-access status from
#                  OpenAlex, by DOI, read by the publications page.
# All three are read from the raw URL at build time and in the browser, so the
# numbers stay fresh without a redeploy. The site workflow only runs on main,
# pull requests and its own daily schedule, so this push never triggers a
# deployment.
#
# Each fetch writes into the github-data worktree, over the previous snapshot,
# and writes nothing when it fails: the site then keeps showing the last good
# figures with their "updated ..." date. A well-formed but implausible answer
# (a headline figure fallen by more than 10 %, see scripts/lib/snapshot.ts)
# is such a failure too. Every failure except a routine Scholar block fails the
# run after the commit, so it is reported instead of passing silently; a real
# drop is accepted by running the workflow by hand with accept_drop.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      accept_drop:
        description: Accept a fall of a headline figure by more than 10 % (a real drop, not a broken source)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one; a cancelled run has not pushed yet,
  # the previous snapshots stay in place and the newer run writes them
  cancel-in-progress: true

jobs:
  github-data:
    name: github-data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The worktree is prepared first: every fetch reads the previous snapshot
      # from the very path it writes (Scholar its accumulated history, all
      # three the figures the plausibility guard compares). A missing file is
      # normal on the first run.
      - name: Prepare the github-data worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin github-data; then
            git fetch origin github-data
            git worktree add ../data origin/github-data
          else
            git worktree add --detach ../data
            git -C ../data checkout --orphan github-data
            git -C ../data rm -rfq . || true
          fi
      # No fetch may fail another: each is continue-on-error and a failed one
      # writes nothing, so its previous snapshot is committed again unchanged.
      - name: Fetch GitHub
        id: github
        continue-on-error: true
        run: npm run fetch:github -- ../data/github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_ACCEPT_DROP: ${{ inputs.accept_drop && '1' || '' }}
      # Scholar has no API and blocks the GitHub-hosted runner on most days.
      # A block (exit code 75 after the script's own retries) is only a
      # warning; a changed page layout or an implausible drop fails the step.
      - name: Fetch Google Scholar
        id: scholar
        continue-on-error: true
        run: |
          status=0
          npm run fetch:scholar -- ../data/scholar.json || status=$?
          if [ "$status" -eq 75 ]; then
            echo "::warning title=Google Scholar blocked::the previous scholar.json is kept"
            exit 0
          fi
          exit "$status"
        env:
          SNAPSHOT_ACCEPT_DROP: ${{ inputs.accept_drop && '1' || '' }}
      # OpenAlex needs no key; OPENALEX_MAILTO (a repository variable, unset by
      # default) only asks for the polite pool.
      - name: Fetch citations
        id: citations
        continue-on-error: true
        run: npm run fetch:citations -- ../data/citations.json
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          SNAPSHOT_ACCEPT_DROP: ${{ inputs.accept_drop && '1' || '' }}
      - name: Commit to the github-data branch
        run: |
          cd ../data
          # A fetch that failed on the very first run has not produced a file.
          for f in github.json scholar.json citations.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update data snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:github-data
      - name: Fail on a failed fetch
        if: steps.github.outcome == 'failure' || steps.scholar.outcome == 'failure' || steps.citations.outcome == 'failure'
        run: |
          echo "::error::fetch outcomes: GitHub ${{ steps.github.outcome }}, Scholar ${{ steps.scholar.outcome }}, citations ${{ steps.citations.outcome }} - the failed snapshots were not updated, see the step logs"
          exit 1
