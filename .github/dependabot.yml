# Keep the GitHub Actions, the npm and the uv dependencies up to date, monthly,
# since every update pull request runs the checks.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # vue-tsc and @astrojs/check cannot run on the TypeScript 7 (Go) compiler
      # yet; lift once they support it.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
