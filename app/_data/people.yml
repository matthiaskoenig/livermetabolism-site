  repository: 'https://github.com/anfark'
  homepage: 'https://github.com/draeger-lab/insilico'
  description: '<img src="/assets/image/projects/insilico_logo.png" title="InSilico" height="80" align="left"/> Within his thesis the concept of an Modular Research Environment (MRE) was developed. An MRE is a modular application framework that can be extended with plugins to create a new tool. InSilico is the working proof-of-principle implementation of such an MRE and was developed alongside this work. The created infrastructure of InSilico can be used to create, share and reuse custom research tools with less effort, time, and resources compared to the traditional approach.'

- id: 'shalin_shah'
