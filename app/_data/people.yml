  image: 'shalin_shah.png'
  orcid:
  repository: 'https://github.com/shalinshah1993/SBSCL'
  homepage: 'https://github.com/shalinshah1993'
  description: '<img src="/assets/image/gsoc.jpg" title="GSOC" height="80" align="left"/> The Systems Biology Simulation Core Library (SBSCL) provides an efficient and exhaustive Java™ implementation of methods to interpret the content of models encoded in the Systems Biology Markup Language (SBML) and its numerical solution. This library is based on the JSBML project and can be used on every operating system for which a Java Virtual Machine is available. Within this project SBSCL was extended among others with better support for SED-ML and COMBINE archives. See also <a href="https://ssdoesgsoc.wordpress.com/" target="_blank">https://ssdoesgsoc.wordpress.com/</a>.'

