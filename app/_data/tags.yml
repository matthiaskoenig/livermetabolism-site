# Single source of truth for the 5 research-area tags used to categorize
# projects, publications, news, software, funding, and editorial roles
# (app/_data/{projects,publication_tags,news,software,funding,editors}.yml).
#
# "tag" must exactly match the strings used in those files' `tags:` lists.
# "icon" is a Font Awesome 4 class name (without the leading "fa fa-" prefix,
# just the modifier, e.g. "fa-cube" is used as `class="fa {{ tag.icon }}"`).
# Colors are assigned separately in app/css/main.scss ($tag-colors), keyed
# by the same slug produced by Liquid's `slugify` filter on "tag".

- tag: "Digital Twins"
  icon: fa-cube
  short_description: "Physiologically based models that mirror individual patients, from molecule to whole body."
  description: >
    Mechanistic, patient-specific models spanning molecule to whole body that
    mirror an individual's physiology, enabling simulation-based prediction
    of disease progression and treatment response.

- tag: "AI"
  icon: fa-heartbeat
  short_description: "Mechanistic modeling meets machine learning for predictive, personalized medicine."
  description: >
    Machine learning combined with mechanistic modeling to extract patterns
    from complex biomedical data and support predictive, personalized
    decision-making in medicine.

- tag: "Digital Pathology"
  icon: fa-picture-o
  short_description: "AI-driven analysis of whole-slide histology to quantify liver structure and disease at scale."
  description: >
    Computational and AI-driven analysis of whole-slide histology images to
    quantify tissue structure, zonation, and disease patterns at scale.

- tag: "Pharmacometrics"
  icon: fa-line-chart
  short_description: "Physiologically based pharmacokinetic/ pharmacodynamic models for precision dosing."
  description: >
    Physiologically based pharmacokinetic and pharmacodynamic (PBPK/PD)
    modeling of drug absorption, distribution, metabolism, and excretion to
    support precision dosing.

- tag: "Open & FAIR"
  icon: fa-unlock-alt
  short_description: "Reproducible, standardized models and data that the community can build on."
  description: >
    Open, FAIR (Findable, Accessible, Interoperable, Reusable), and
    reproducible models, data, and software that the research community can
    build on.
